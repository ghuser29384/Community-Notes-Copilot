name: Siti OSS evidence closure v2 pure shell

on:
  pull_request:
    paths:
      - '.github/workflows/siti-oss-evidence-closure-v2-pure.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evidence-closure-pure:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgis/postgis:13-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Run evidence closure without marketplace actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          WORK="$GITHUB_WORKSPACE/work"
          REPO="$WORK/harness"
          mkdir -p "$WORK"
          git clone --single-branch --branch "$HEAD_BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$REPO"
          cd "$REPO"
          mkdir -p qa/siti-oss-final qa/siti-oss-highest runner validation \
            artifacts/{logs,diffs,browser-v2,engineering-v2,concurrency,s3-contract,exif,storage}
          printf '%s\n' "$TESTED_HEAD" > artifacts/tested-head-sha.txt

          capture() {
            status=$?
            trap - EXIT
            set +e
            cd "$REPO"
            printf '%s\n' "$status" > artifacts/workflow-exit.txt
            docker logs siti-minio > artifacts/logs/minio-final.log 2>&1 || true
            find artifacts -type f -printf '%P\t%s bytes\n' | sort \
              > artifacts/ARTIFACT-INDEX.txt
            find artifacts -type f ! -name SHA256SUMS.txt -print0 | sort -z | \
              xargs -0 sha256sum > artifacts/SHA256SUMS.txt
            python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('artifacts')
          output = Path('evidence-closure-v2.zip')
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      zf.write(path, arcname=str(path.relative_to(root)))
          PY
            mkdir -p qa/siti-oss-evidence-closure-v2/results
            cp evidence-closure-v2.zip \
              qa/siti-oss-evidence-closure-v2/results/evidence-closure-v2.zip
            for file in \
              artifacts/evidence-closure-v2-summary.json \
              artifacts/browser-v2/reportcards-fix-e2e-summary.json \
              artifacts/concurrency/same-head-concurrency.json \
              artifacts/s3-contract/s3-content-type-contract.json \
              artifacts/exif/original-exif-verification.json \
              artifacts/exif/uploaded-exif-verification.json \
              artifacts/storage/minio-object-verification.json; do
              if [ -f "$file" ]; then
                cp "$file" qa/siti-oss-evidence-closure-v2/results/
              fi
            done
            git config user.name github-actions
            git config user.email github-actions@users.noreply.github.com
            git add qa/siti-oss-evidence-closure-v2/results
            if ! git diff --cached --quiet; then
              git commit -m "Record Siti OSS evidence-closure v2 result"
              git push origin "HEAD:${HEAD_BRANCH}"
            fi
            exit "$status"
          }
          trap capture EXIT

          sudo apt-get update
          sudo apt-get install -y postgresql-client python3-venv
          sudo npm install -g n
          sudo n 14.21.3
          hash -r
          node --version | tee artifacts/logs/node-reportcards-version.txt

          git fetch --no-tags origin \
            3899fa0720639af6eacbf1ffe10d940ceebad366 \
            e0ac0eed09fa623aa7edd224f8cc2696f28bb700
          for file in \
            apply_candidate_fixes.py \
            apply_gate_fixes_v2.py \
            apply_gate_fixes_v3.py \
            audit_compatibility.sql \
            patch_gate_b_harness_v2.py \
            reportcards_fix_e2e.mjs; do
            git show 3899fa0720639af6eacbf1ffe10d940ceebad366:qa/siti-oss-final/$file \
              > qa/siti-oss-final/$file
          done
          for file in \
            apply_completion_fixes.py \
            patch_final_browser_harness.py \
            s3_signature_contract.mjs \
            style_candidate_sources.py; do
            git show e0ac0eed09fa623aa7edd224f8cc2696f28bb700:qa/siti-oss-highest/$file \
              > qa/siti-oss-highest/$file
          done

          git clone https://github.com/petabencana/sitioss-schema.git targets/schema
          git -C targets/schema checkout 091229bff2a299c31b814979008ebc6df7b428e8
          git clone https://github.com/petabencana/-Depricated-sitioss-server.git targets/server
          git -C targets/server checkout 933f345801340027181be21d24671146e3785701
          git clone https://github.com/petabencana/sitioss-reportcards-ng.git targets/reportcards
          git -C targets/reportcards checkout eaec8b1a2bfe15745077c0e8ad5ff69fbdccc552
          for repo in schema server reportcards; do
            git -C "targets/$repo" show -s --format='%H%x09%cI%x09%s' \
              > "artifacts/${repo}-commit.tsv"
          done

          cd targets/reportcards
          npm install --no-audit --no-fund \
            > ../../artifacts/logs/reportcards-install.log 2>&1
          npm install --save-dev --save-exact @types/jasmine@2.8.16 \
            --no-audit --no-fund \
            > ../../artifacts/logs/reportcards-pin-jasmine.log 2>&1
          cd "$REPO"

          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check \
            pillow==10.4.0 boto3==1.34.162 requests psycopg2-binary \
            > artifacts/logs/python-tools-install.log 2>&1

          docker run -d --name siti-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin123 \
            -e MINIO_API_CORS_ALLOW_ORIGIN=http://127.0.0.1:4200 \
            minio/minio:latest server /data \
            > artifacts/logs/minio-container-id.txt
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null

          python - <<'PY'
          import json
          from pathlib import Path
          import boto3
          from botocore.config import Config
          from PIL import Image, TiffImagePlugin

          s3 = boto3.client(
              's3',
              endpoint_url='http://127.0.0.1:9000',
              aws_access_key_id='minioadmin',
              aws_secret_access_key='minioadmin123',
              region_name='us-east-1',
              config=Config(signature_version='s3v4', s3={'addressing_style': 'path'}),
          )
          bucket = 'petabencana-image-uploads'
          s3.create_bucket(Bucket=bucket)
          s3.put_bucket_cors(
              Bucket=bucket,
              CORSConfiguration={
                  'CORSRules': [{
                      'AllowedHeaders': ['*'],
                      'AllowedMethods': ['GET', 'HEAD', 'PUT'],
                      'AllowedOrigins': ['http://127.0.0.1:4200'],
                      'ExposeHeaders': ['ETag'],
                      'MaxAgeSeconds': 3600,
                  }]
              },
          )
          image = Image.new('RGB', (16, 16), (53, 105, 142))
          exif = Image.Exif()
          exif[34853] = {
              1: 'S',
              2: (
                  TiffImagePlugin.IFDRational(6, 1),
                  TiffImagePlugin.IFDRational(10, 1),
                  TiffImagePlugin.IFDRational(3141, 100),
              ),
              3: 'E',
              4: (
                  TiffImagePlugin.IFDRational(106, 1),
                  TiffImagePlugin.IFDRational(49, 1),
                  TiffImagePlugin.IFDRational(3771, 100),
              ),
          }
          path = Path('runner/true-gps-exif.jpg')
          image.save(path, format='JPEG', quality=92, exif=exif)
          parsed = Image.open(path).getexif().get_ifd(34853)
          raw = path.read_bytes()
          result = {
              'path': str(path),
              'bytes': len(raw),
              'has_exif_header': b'Exif\x00\x00' in raw,
              'gps_ifd': {str(k): str(v) for k, v in parsed.items()},
              'gps_tag_present': bool(parsed),
          }
          Path('artifacts/exif/original-exif-verification.json').write_text(
              json.dumps(result, indent=2), encoding='utf-8'
          )
          assert result['has_exif_header'] and result['gps_tag_present'], result
          PY

          sudo n 10.24.1
          hash -r
          node --version | tee artifacts/logs/node-server-version.txt
          export PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres \
            PGPASSWORD=postgres PGDATABASE=cognicity_evidence_closure_v2 \
            PG_DEFAULT_DB=postgres COUNTRY=id DATA=true FUNCTIONS=true SCHEMA=true
          cd targets/schema
          npm install --no-audit --no-fund \
            > ../../artifacts/logs/schema-install.log 2>&1
          ./build/run.sh > ../../artifacts/logs/schema-build.log 2>&1
          cd "$REPO"
          psql -h 127.0.0.1 -U postgres -d cognicity_evidence_closure_v2 \
            -v ON_ERROR_STOP=1 -f qa/siti-oss-final/audit_compatibility.sql \
            > artifacts/logs/compatibility.log 2>&1
          cd targets/server
          NODE_ENV=development npm install --production=false --no-audit --no-fund \
            > ../../artifacts/logs/server-install.log 2>&1
          cd "$REPO"

          SITI_LEGACY_AUDIT_SCRIPTS="$REPO/qa/siti-oss-final" \
          SITI_SERVER_SOURCE="$REPO/targets/server" \
          SITI_REPORTCARDS_SOURCE="$REPO/targets/reportcards" \
            python qa/siti-oss-highest/apply_completion_fixes.py \
            > artifacts/logs/apply-completion.log
          cp qa/siti-oss-final/reportcards_fix_e2e.mjs runner/audit-v2.mjs
          cp qa/siti-oss-highest/s3_signature_contract.mjs runner/s3-contract.mjs
          SITI_BROWSER_HARNESS="$REPO/runner/audit-v2.mjs" \
            python qa/siti-oss-final/patch_gate_b_harness_v2.py \
            > artifacts/logs/patch-harness-v2.log
          SITI_BROWSER_HARNESS="$REPO/runner/audit-v2.mjs" \
            python qa/siti-oss-highest/patch_final_browser_harness.py \
            > artifacts/logs/patch-final-harness.log
          SITI_BROWSER_HARNESS="$REPO/runner/audit-v2.mjs" \
            python qa/siti-oss-evidence-closure-v2/patch_audit_v2.py \
            > artifacts/logs/patch-evidence-closure-v2.log

          git -C targets/server diff --check
          git -C targets/reportcards -c core.whitespace=cr-at-eol diff --check
          git -C targets/server diff --binary > artifacts/diffs/server-tracked.patch
          (
            cd targets/server
            git diff --no-index --binary /dev/null src/lib/presignPutObject.js || true
          ) > artifacts/diffs/server-new-file.patch
          cat artifacts/diffs/server-tracked.patch artifacts/diffs/server-new-file.patch \
            > artifacts/diffs/server-candidate-complete.patch
          git -C targets/reportcards diff --binary \
            > artifacts/diffs/reportcards-candidate.patch
          cd targets/server
          npm run build > ../../artifacts/logs/server-build.log 2>&1
          cd "$REPO"

          git clone https://github.com/petabencana/-Depricated-sitioss-server.git \
            validation/server-clean
          git -C validation/server-clean checkout \
            933f345801340027181be21d24671146e3785701
          git -C validation/server-clean apply --check \
            ../../artifacts/diffs/server-candidate-complete.patch
          git -C validation/server-clean apply \
            ../../artifacts/diffs/server-candidate-complete.patch
          cp -a targets/server/node_modules validation/server-clean/
          (cd validation/server-clean && npm run build) \
            > artifacts/logs/server-clean-patch-build.log 2>&1

          sudo n 14.21.3
          hash -r
          git clone https://github.com/petabencana/sitioss-reportcards-ng.git \
            validation/reportcards-clean
          git -C validation/reportcards-clean checkout \
            eaec8b1a2bfe15745077c0e8ad5ff69fbdccc552
          git -C validation/reportcards-clean apply --check \
            ../../artifacts/diffs/reportcards-candidate.patch
          git -C validation/reportcards-clean apply \
            ../../artifacts/diffs/reportcards-candidate.patch
          cp -a targets/reportcards/node_modules validation/reportcards-clean/
          python - <<'PY'
          import json
          from pathlib import Path
          for root in [Path('validation/reportcards-clean'), Path('targets/reportcards')]:
              for name in ['environment.json', 'environment.prod.json']:
                  path = root / 'src/environments/id' / name
                  data = json.loads(path.read_text())
                  data['data_server'] = 'http://127.0.0.1:8001/'
                  data['app'] = 'http://127.0.0.1:4200/'
                  path.write_text(json.dumps(data, indent=2))
          PY
          (
            cd validation/reportcards-clean
            NODE_OPTIONS=--max_old_space_size=6144 npm run build-dev-id
            NODE_OPTIONS=--max_old_space_size=6144 npm run build-prod-id
          ) > artifacts/logs/reportcards-clean-patch-builds.log 2>&1
          (
            cd targets/reportcards
            NODE_OPTIONS=--max_old_space_size=6144 npm run build-dev-id
            NODE_OPTIONS=--max_old_space_size=6144 npm run build-prod-id
          ) > artifacts/logs/reportcards-builds.log 2>&1

          cd targets/reportcards
          cp src/test.ts ../../artifacts/engineering-v2/test.ts.original
          python - <<'PY'
          from pathlib import Path
          path = Path('src/test.ts')
          text = path.read_text()
          old = r"/\.spec\.ts$/"
          new = r"/(image-uploader\.component\.spec|location-picker\.component\.spec)\.ts$/"
          if text.count(old) != 1:
              raise RuntimeError(f'expected one unit-test regex, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          set +e
          CHROME_BIN=/usr/bin/google-chrome NODE_OPTIONS=--max_old_space_size=6144 \
            timeout 15m node --max_old_space_size=6144 \
            ./node_modules/@angular/cli/bin/ng test --watch=false \
            --browsers=ChromeHeadlessNoSandbox --code-coverage=false \
            --source-map=false --progress=false \
            > ../../artifacts/engineering-v2/focused-unit.log 2>&1
          echo $? > ../../artifacts/engineering-v2/focused-unit.exit
          set -e
          git checkout -- src/test.ts
          cd "$REPO"

          sudo n 10.24.1
          hash -r
          cat > notify_stub.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('content-length', '0'))
                  if length:
                      self.rfile.read(length)
                  self.send_response(200)
                  self.send_header('content-type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'{"ok":true}')
              def log_message(self, fmt, *args):
                  pass
          HTTPServer(('127.0.0.1', 8999), H).serve_forever()
          PY
          nohup python notify_stub.py > artifacts/logs/notify-stub.log 2>&1 &
          export PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres \
            PGPASSWORD=postgres PGDATABASE=cognicity_evidence_closure_v2 \
            PGSSL=false PGTIMEOUT=30000 PORT=8001 LOG_CONSOLE=true \
            LOG_DIR=/tmp LOG_LEVEL=error CORS=true SECURE_AUTH0=true \
            AUTH0_SECRET=local-validation-secret \
            AUTH0_CLIENT_ID=local-validation-client \
            NOTIFY_ENDPOINT=http://127.0.0.1:8999/notify/ \
            NOTIFY_API_KEY=local-validation AWS_REGION=us-east-1 \
            AWS_S3_ACCESS_KEY_ID=minioadmin \
            AWS_S3_SECRET_ACCESS_KEY=minioadmin123 \
            AWS_SIGNATURE_VERSION=v4 AWS_S3_ENDPOINT=http://127.0.0.1:9000 \
            AWS_S3_FORCE_PATH_STYLE=true \
            IMAGES_BUCKET=petabencana-image-uploads \
            IMAGES_HOST=127.0.0.1:9000/petabencana-image-uploads \
            IMAGE_MIME_TYPES=image/png,image/jpeg
          NODE_ENV=production nohup node targets/server/dist \
            > artifacts/logs/server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8001/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8001/ >/dev/null

          cat > spa_server.py <<'PY'
          import http.server, os, socketserver
          ROOT = os.path.abspath('targets/reportcards/dist/dev-id')
          class Handler(http.server.SimpleHTTPRequestHandler):
              def translate_path(self, path):
                  original = super().translate_path(path)
                  rel = os.path.relpath(original, os.getcwd())
                  return os.path.join(ROOT, rel)
              def do_GET(self):
                  clean = self.path.split('?', 1)[0].split('#', 1)[0]
                  candidate = os.path.join(ROOT, clean.lstrip('/'))
                  if clean != '/' and not os.path.exists(candidate):
                      self.path = '/index.html'
                  return super().do_GET()
              def end_headers(self):
                  self.send_header('Cache-Control', 'no-store')
                  super().end_headers()
          os.chdir(ROOT)
          with socketserver.TCPServer(('127.0.0.1', 4200), Handler) as httpd:
              httpd.serve_forever()
          PY
          nohup python spa_server.py \
            > artifacts/logs/reportcards-static-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4200/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4200/ >/dev/null

          sudo n 20.19.1
          hash -r
          cd runner
          npm init -y >/dev/null
          npm install --no-save playwright@1.54.1 \
            > ../artifacts/logs/playwright-install.log 2>&1
          npx playwright install --with-deps chromium \
            > ../artifacts/logs/playwright-browser-install.log 2>&1
          REPORTCARDS_URL=http://127.0.0.1:4200 \
          SITI_SERVER_URL=http://127.0.0.1:8001 \
          SITI_OBJECT_STORAGE_ORIGIN=http://127.0.0.1:9000 \
          SITI_TRUE_EXIF_JPEG="$REPO/runner/true-gps-exif.jpg" \
          SITI_VALIDATION_OUT="$REPO/artifacts/browser-v2" \
            node audit-v2.mjs | tee ../artifacts/logs/browser-v2-console.log
          SITI_SERVER_URL=http://127.0.0.1:8001 \
          SITI_S3_CONTRACT_OUT="$REPO/artifacts/s3-contract" \
            node s3-contract.mjs | tee ../artifacts/logs/s3-contract-v2.log
          cd "$REPO"

          python - <<'PY'
          import concurrent.futures
          import json
          from collections import Counter
          from pathlib import Path
          import boto3
          from botocore.config import Config
          from PIL import Image
          import psycopg2
          import requests

          uploaded = Path(
              'artifacts/browser-v2/true-exif-gps-image-real-storage-upload-1.bin'
          )
          image = Image.open(uploaded)
          exif = image.getexif()
          gps = exif.get_ifd(34853) if exif else {}
          raw = uploaded.read_bytes()
          uploaded_exif = {
              'path': str(uploaded),
              'bytes': len(raw),
              'has_exif_header': b'Exif\x00\x00' in raw,
              'gps_ifd': {str(k): str(v) for k, v in gps.items()},
              'gps_tag_present': bool(gps),
          }
          Path('artifacts/exif/uploaded-exif-verification.json').write_text(
              json.dumps(uploaded_exif, indent=2), encoding='utf-8'
          )
          assert not uploaded_exif['has_exif_header'], uploaded_exif
          assert not uploaded_exif['gps_tag_present'], uploaded_exif

          s3 = boto3.client(
              's3', endpoint_url='http://127.0.0.1:9000',
              aws_access_key_id='minioadmin',
              aws_secret_access_key='minioadmin123',
              region_name='us-east-1',
              config=Config(signature_version='s3v4', s3={'addressing_style': 'path'}),
          )
          bucket = 'petabencana-image-uploads'
          listing = s3.list_objects_v2(Bucket=bucket).get('Contents', [])
          objects = []
          for item in listing:
              head = s3.head_object(Bucket=bucket, Key=item['Key'])
              objects.append({
                  'key': item['Key'],
                  'size': item['Size'],
                  'content_type': head.get('ContentType'),
                  'etag': head.get('ETag'),
              })
          storage_result = {'bucket': bucket, 'object_count': len(objects), 'objects': objects}
          Path('artifacts/storage/minio-object-verification.json').write_text(
              json.dumps(storage_result, indent=2), encoding='utf-8'
          )
          assert len(objects) >= 2, storage_result

          base = 'http://127.0.0.1:8001'
          card = requests.post(base + '/cards', json={
              'username': 'evidence-closure-v2-race',
              'network': 'twitter', 'language': 'en', 'network_data': {},
          }, timeout=20)
          card.raise_for_status()
          card_id = card.json()['cardId']
          payload = {
              'disaster_type': 'flood', 'partnerCode': '', 'tweetID': '',
              'is_training': False, 'sub_submission': False,
              'card_data': {'report_type': 'flood', 'flood_depth': 44},
              'text': 'Evidence closure v2 real-report concurrency',
              'image_url': '', 'created_at': '2026-08-06T16:00:00.000Z',
              'location': {'lat': -6.1754, 'lng': 106.8272},
          }
          def submit(_):
              response = requests.put(base + '/cards/' + card_id, json=payload, timeout=30)
              try: body = response.json()
              except Exception: body = response.text
              return {'status': response.status_code, 'body': body}
          with concurrent.futures.ThreadPoolExecutor(max_workers=50) as pool:
              results = list(pool.map(submit, range(50)))
          counts = Counter(item['status'] for item in results)
          with psycopg2.connect(
              host='127.0.0.1', port=5432, user='postgres', password='postgres',
              dbname='cognicity_evidence_closure_v2',
          ) as connection:
              with connection.cursor() as cursor:
                  cursor.execute('SELECT count(*) FROM grasp.reports WHERE card_id=%s', (card_id,))
                  report_rows = cursor.fetchone()[0]
                  cursor.execute('SELECT count(*) FROM cognicity.all_reports WHERE card_id=%s', (card_id,))
                  all_report_rows = cursor.fetchone()[0]
                  cursor.execute(
                      "SELECT count(*) FROM grasp.log WHERE card_id=%s AND event_type='REPORT SUBMITTED'",
                      (card_id,),
                  )
                  submitted_log_rows = cursor.fetchone()[0]
          output = {
              'card_id': card_id, 'report_mode': 'real', 'attempts': 50,
              'status_counts': dict(counts), 'report_rows': report_rows,
              'all_report_rows': all_report_rows,
              'submitted_log_rows': submitted_log_rows,
              'sample_results': results[:10],
          }
          Path('artifacts/concurrency/same-head-concurrency.json').write_text(
              json.dumps(output, indent=2), encoding='utf-8'
          )
          assert counts[200] == 1 and counts[409] == 49 and counts[500] == 0, output
          assert report_rows == all_report_rows == submitted_log_rows == 1, output
          PY

          python - <<'PY'
          import json
          from pathlib import Path
          browser = json.loads(Path('artifacts/browser-v2/reportcards-fix-e2e-summary.json').read_text())
          concurrency = json.loads(Path('artifacts/concurrency/same-head-concurrency.json').read_text())
          s3 = json.loads(Path('artifacts/s3-contract/s3-content-type-contract.json').read_text())
