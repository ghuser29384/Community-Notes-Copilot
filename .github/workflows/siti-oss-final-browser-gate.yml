name: Siti OSS final browser gate

on:
  pull_request:
    paths:
      - '.github/workflows/siti-oss-final-browser-gate.yml'
      - 'qa/siti-oss-highest/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgis/postgis:13-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Materialize reviewed helpers and exact public sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 3899fa0720639af6eacbf1ffe10d940ceebad366
          mkdir -p qa/siti-oss-final runner artifacts/{logs,diffs,browser}
          for file in \
            apply_candidate_fixes.py \
            apply_gate_fixes_v2.py \
            apply_gate_fixes_v3.py \
            audit_compatibility.sql \
            patch_gate_b_harness_v2.py \
            reportcards_fix_e2e.mjs; do
            git show 3899fa0720639af6eacbf1ffe10d940ceebad366:qa/siti-oss-final/$file \
              > qa/siti-oss-final/$file
          done
          git clone https://github.com/petabencana/sitioss-schema.git targets/schema
          git -C targets/schema checkout 091229bff2a299c31b814979008ebc6df7b428e8
          git clone https://github.com/petabencana/-Depricated-sitioss-server.git targets/server
          git -C targets/server checkout 933f345801340027181be21d24671146e3785701
          git clone https://github.com/petabencana/sitioss-reportcards-ng.git targets/reportcards
          git -C targets/reportcards checkout eaec8b1a2bfe15745077c0e8ad5ff69fbdccc552
          for repo in schema server reportcards; do
            git -C "targets/$repo" show -s --format='%H%x09%cI%x09%s' \
              > "artifacts/${repo}-commit.tsv"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '14.21.3'

      - name: Install Report Cards toolchain
        working-directory: targets/reportcards
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund > ../../artifacts/logs/reportcards-install.log 2>&1
          npm install --save-dev --save-exact @types/jasmine@2.8.16 --no-audit --no-fund \
            > ../../artifacts/logs/reportcards-pin-jasmine.log 2>&1

      - uses: actions/setup-node@v4
        with:
          node-version: '10.24.1'

      - name: Build isolated schema and install legacy server
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: cognicity_browser_final
          PG_DEFAULT_DB: postgres
          COUNTRY: id
          DATA: 'true'
          FUNCTIONS: 'true'
          SCHEMA: 'true'
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y postgresql-client
          cd targets/schema
          npm install --no-audit --no-fund > ../../artifacts/logs/schema-install.log 2>&1
          ./build/run.sh > ../../artifacts/logs/schema-build.log 2>&1
          cd ../..
          psql -h 127.0.0.1 -U postgres -d cognicity_browser_final \
            -v ON_ERROR_STOP=1 -f qa/siti-oss-final/audit_compatibility.sql \
            > artifacts/logs/compatibility.log 2>&1
          cd targets/server
          NODE_ENV=development npm install --production=false --no-audit --no-fund \
            > ../../artifacts/logs/server-install.log 2>&1

      - name: Apply final candidate and browser harness
        shell: bash
        run: |
          set -euo pipefail
          SITI_LEGACY_AUDIT_SCRIPTS="$PWD/qa/siti-oss-final" \
          SITI_SERVER_SOURCE="$PWD/targets/server" \
          SITI_REPORTCARDS_SOURCE="$PWD/targets/reportcards" \
            python qa/siti-oss-highest/apply_completion_fixes.py \
            > artifacts/logs/apply-completion.log
          cp qa/siti-oss-final/reportcards_fix_e2e.mjs runner/audit.mjs
          SITI_BROWSER_HARNESS="$PWD/runner/audit.mjs" \
            python qa/siti-oss-final/patch_gate_b_harness_v2.py \
            > artifacts/logs/patch-harness-v2.log
          SITI_BROWSER_HARNESS="$PWD/runner/audit.mjs" \
            python qa/siti-oss-highest/patch_final_browser_harness.py \
            > artifacts/logs/patch-final-harness.log
          git -C targets/server diff --check
          git -C targets/reportcards -c core.whitespace=cr-at-eol diff --check
          git -C targets/server diff --binary > artifacts/diffs/server-browser-candidate.patch
          git -C targets/reportcards diff --binary > artifacts/diffs/reportcards-browser-candidate.patch
          cd targets/server
          npm run build > ../../artifacts/logs/server-build.log 2>&1

      - name: Start patched backend
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: cognicity_browser_final
          PGSSL: 'false'
          PGTIMEOUT: '30000'
          PORT: '8001'
          LOG_CONSOLE: 'true'
          LOG_DIR: /tmp
          LOG_LEVEL: error
          CORS: 'true'
          SECURE_AUTH0: 'true'
          AUTH0_SECRET: local-validation-secret
          AUTH0_CLIENT_ID: local-validation-client
          NOTIFY_ENDPOINT: http://127.0.0.1:8999/notify/
          NOTIFY_API_KEY: local-validation
          AWS_REGION: ap-southeast-1
          AWS_S3_ACCESS_KEY_ID: local-validation-key
          AWS_S3_SECRET_ACCESS_KEY: local-validation-secret
          AWS_SIGNATURE_VERSION: v4
          IMAGES_BUCKET: petabencana-image-uploads
          IMAGES_HOST: images.petabencana.invalid
          IMAGE_MIME_TYPES: image/png,image/jpeg
        run: |
          set -euo pipefail
          cat > notify_stub.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def do_POST(self):
                  length=int(self.headers.get('content-length','0'))
                  if length: self.rfile.read(length)
                  self.send_response(200); self.end_headers(); self.wfile.write(b'{"ok":true}')
              def log_message(self, fmt, *args): pass
          HTTPServer(('127.0.0.1',8999),H).serve_forever()
          PY
          nohup python3 notify_stub.py > artifacts/logs/notify-stub.log 2>&1 &
          NODE_ENV=production nohup node targets/server/dist > artifacts/logs/server.log 2>&1 &
          echo $! > artifacts/logs/server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8001/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/logs/server.log
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '14.21.3'

      - name: Build patched Report Cards development bundle
        working-directory: targets/reportcards
        shell: bash
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ['environment.json','environment.prod.json']:
              path=Path('src/environments/id')/name
              data=json.loads(path.read_text())
              data['data_server']='http://127.0.0.1:8001/'
              data['app']='http://127.0.0.1:4200/'
              path.write_text(json.dumps(data,indent=2))
          PY
          npm run build-dev-id > ../../artifacts/logs/reportcards-build-dev.log 2>&1

      - name: Start SPA with history fallback
        shell: bash
        run: |
          set -euo pipefail
          cat > spa_server.py <<'PY'
          import http.server, os, socketserver
          ROOT=os.path.abspath('targets/reportcards/dist/dev-id')
          class Handler(http.server.SimpleHTTPRequestHandler):
              def translate_path(self,path):
                  original=super().translate_path(path)
                  rel=os.path.relpath(original,os.getcwd())
                  return os.path.join(ROOT,rel)
              def do_GET(self):
                  clean=self.path.split('?',1)[0].split('#',1)[0]
                  candidate=os.path.join(ROOT,clean.lstrip('/'))
                  if clean!='/' and not os.path.exists(candidate): self.path='/index.html'
                  return super().do_GET()
              def end_headers(self):
                  self.send_header('Cache-Control','no-store')
                  super().end_headers()
          os.chdir(ROOT)
          with socketserver.TCPServer(('127.0.0.1',4200),Handler) as httpd: httpd.serve_forever()
          PY
          nohup python3 spa_server.py > artifacts/logs/reportcards-static-server.log 2>&1 &
          echo $! > artifacts/logs/reportcards-static-server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4200/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/logs/reportcards-static-server.log
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.1'

      - name: Run final desktop, mobile, recovery, media, and zero-page-error gates
        working-directory: runner
        shell: bash
        env:
          REPORTCARDS_URL: http://127.0.0.1:4200
          SITI_SERVER_URL: http://127.0.0.1:8001
          SITI_VALIDATION_OUT: ${{ github.workspace }}/artifacts/browser
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
          node audit.mjs | tee ../artifacts/logs/browser-console.log
          node - <<'NODE'
          const fs=require('fs');
          const p='../artifacts/browser/reportcards-fix-e2e-summary.json';
          const summary=JSON.parse(fs.readFileSync(p,'utf8'));
          if (!Object.values(summary.assertions).every(Boolean)) throw new Error(JSON.stringify(summary.assertions));
          const mobile=summary.scenarioResults.find(x=>x.id==='mobile-success');
          if (!mobile || !mobile.reportPersisted || mobile.errors !== 0 || mobile.viewport?.width !== 390 || mobile.viewport?.height !== 844) {
            throw new Error('mobile gate did not prove 390x844 persistence: '+JSON.stringify(mobile));
          }
          if (!summary.assertions.no_page_errors) throw new Error('browser page errors remain');
          console.log(JSON.stringify({pass:true,assertions:summary.assertions,mobile},null,2));
          NODE

      - name: Capture evidence
        if: always()
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set +e
          psql -h 127.0.0.1 -U postgres -d cognicity_browser_final \
            -c 'SELECT count(*) AS cards FROM grasp.cards; SELECT count(*) AS reports FROM grasp.reports; SELECT count(*) AS all_reports FROM cognicity.all_reports;' \
            > artifacts/database-end-state.txt 2>&1
          find artifacts -type f -printf '%P\t%s bytes\n' | sort > artifacts/ARTIFACT-INDEX.txt
          find artifacts -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS.txt
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siti-oss-final-browser-gate
          path: artifacts
          retention-days: 30
          if-no-files-found: error
