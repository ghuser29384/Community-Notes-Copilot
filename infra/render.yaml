services:
  - type: web
    name: community-notes-ops-api
    runtime: python
    plan: free
    region: virginia
    branch: main
    buildCommand: pip install -r requirements.txt && python3 -m compileall apps/api/app
    startCommand: PYTHONPATH=apps/api python3 apps/api/app/main.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: communitynotes-copilot
          property: connectionString
      - key: APP_ENV
        value: staging
      - key: PERSISTENCE_PROVIDER
        value: postgres
      - key: X_PROVIDER
        value: fixture
      - key: ALLOW_LIVE_X_API
        value: "false"
      - key: ALLOW_LIVE_X_WRITE
        value: "false"
      - key: ALLOW_LIVE_SEARCH
        value: "false"
      - key: ALLOW_LIVE_LLM
        value: "false"
      - key: ALLOW_NON_TEST_MODE_WRITE
        value: "false"
      - key: SEARCH_PROVIDER
        value: fixture
      - key: LLM_PROVIDER
        value: fixture
      - key: COMMUNITY_NOTES_DATA_USE_PURPOSE
        value: community_notes_ai_note_writing
      - key: OPERATIONAL_EVALS_DIRECTLY_NECESSARY
        value: "true"
      - key: TRACK_A_REQUIRES_EXPRESS_CONSENT
        value: "true"
      - key: REQUIRE_BOT_IDENTITY_DISCLOSURE
        value: "true"
      - key: BOT_PROFILE_DISCLOSURE
        value: "AI Note Writer bot: proposed notes are generated by an automated system for Community Notes AI note writing."
      - key: BOT_RESPONSIBLE_PARTY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: USAGE_API_RECONCILIATION_REQUIRED
        value: "true"
      - key: DEVELOPER_CONSOLE_RECONCILIATION_REQUIRED
        value: "true"

databases:
  - name: communitynotes-copilot
    plan: basic-256mb
    region: virginia
    databaseName: community_notes_copilot
