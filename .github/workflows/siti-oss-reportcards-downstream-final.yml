name: Siti OSS Report Cards downstream final validation

on:
  pull_request:
    paths:
      - '.github/workflows/siti-oss-reportcards-downstream-final.yml'
      - 'qa/siti-oss-validation/reportcards_e2e.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reportcards-downstream:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgis/postgis:13-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '10.24.1'

      - name: Clone exact public sources and build isolated compatibility stack
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y postgresql-client
          mkdir -p targets artifacts/logs artifacts/reportcards-e2e
          git clone https://github.com/petabencana/sitioss-schema.git targets/schema
          git -C targets/schema checkout 091229bff2a299c31b814979008ebc6df7b428e8
          git clone https://github.com/petabencana/-Depricated-sitioss-server.git targets/server
          git -C targets/server checkout 933f345801340027181be21d24671146e3785701
          git clone https://github.com/petabencana/sitioss-reportcards-ng.git targets/reportcards
          git -C targets/reportcards checkout eaec8b1a2bfe15745077c0e8ad5ff69fbdccc552
          for repo in schema server reportcards; do
            git -C "targets/$repo" show -s --format='%H%x09%cI%x09%s' > "artifacts/${repo}-commit.tsv"
          done
          cp qa/siti-oss-validation/audit_compatibility.sql artifacts/audit_compatibility.sql

          cd targets/schema
          npm install --no-audit --no-fund
          PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres \
            PGDATABASE=cognicity_reportcards_downstream PG_DEFAULT_DB=postgres \
            COUNTRY=id DATA=true FUNCTIONS=true SCHEMA=true \
            ./build/run.sh > ../../artifacts/logs/schema-build.log 2>&1
          cd ../..
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres \
            -d cognicity_reportcards_downstream -v ON_ERROR_STOP=1 \
            -f qa/siti-oss-validation/audit_compatibility.sql \
            > artifacts/logs/compatibility-migration.log 2>&1

          cd targets/server
          NODE_ENV=development npm install --production=false --no-audit --no-fund \
            > ../../artifacts/logs/server-npm-install.log 2>&1
          npm run build > ../../artifacts/logs/server-build.log 2>&1
          cd ../..

      - name: Start exact legacy server with isolated notification stub
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: cognicity_reportcards_downstream
          PGSSL: 'false'
          PGTIMEOUT: '30000'
          PORT: '8001'
          LOG_CONSOLE: 'true'
          LOG_DIR: /tmp
          LOG_LEVEL: error
          CORS: 'true'
          SECURE_AUTH0: 'true'
          AUTH0_SECRET: local-validation-secret
          AUTH0_CLIENT_ID: local-validation-client
          NOTIFY_ENDPOINT: http://127.0.0.1:8999/notify/
          NOTIFY_API_KEY: local-validation
          AWS_REGION: ap-southeast-1
          AWS_S3_ACCESS_KEY_ID: local-validation-key
          AWS_S3_SECRET_ACCESS_KEY: local-validation-secret
          AWS_SIGNATURE_VERSION: v4
        shell: bash
        run: |
          set -euo pipefail
          cat > notify_stub.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('content-length', '0'))
                  if length:
                      self.rfile.read(length)
                  self.send_response(200)
                  self.send_header('content-type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'{"ok":true}')
              def log_message(self, fmt, *args):
                  pass
          HTTPServer(('127.0.0.1', 8999), Handler).serve_forever()
          PY
          nohup python3 notify_stub.py > artifacts/logs/notify-stub.log 2>&1 &
          NODE_ENV=production nohup node targets/server/dist > artifacts/logs/server.log 2>&1 &
          echo $! > artifacts/logs/server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8001/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/logs/server.log
          exit 1

      - name: Apply explicit audit-only location confirmation patch and build Report Cards
        working-directory: targets/reportcards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          for name in ['environment.json', 'environment.prod.json']:
              path = Path('src/environments/id') / name
              data = json.loads(path.read_text())
              data['data_server'] = 'http://127.0.0.1:8001/'
              data['app'] = 'http://127.0.0.1:4200/'
              path.write_text(json.dumps(data, indent=2))

          path = Path('src/app/components/location-picker/location-picker.component.ts')
          text = path.read_text()
          needle = """    if (this.currentMarker) this.currentMarker.remove(this.map)\n    this.currentMarker = marker\n\n    marker.on('dragend' , () => {"""
          replacement = """    if (this.currentMarker) this.currentMarker.remove(this.map)\n    this.currentMarker = marker\n\n    // AUDIT-ONLY TESTABILITY PATCH: selecting a concrete search result records\n    // the same location state that the dragend handler records. This patch is\n    // not attributed to the unmodified public commit.\n    this.deckService.setLocation({ lat: results[0].y, lng: results[0].x })\n    this.deckService.userCanContinue()\n\n    marker.on('dragend' , () => {"""
          if needle not in text:
              raise SystemExit('location confirmation patch anchor not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          git diff -- src/app/components/location-picker/location-picker.component.ts \
            > ../../artifacts/audit-only-location-confirmation.patch
          npm install --no-audit --no-fund > ../../artifacts/logs/reportcards-npm-install.log 2>&1
          npm run build-dev-id > ../../artifacts/logs/reportcards-build.log 2>&1

      - name: Start Report Cards SPA with history fallback
        shell: bash
        run: |
          set -euo pipefail
          cat > spa_server.py <<'PY'
          import http.server, os, socketserver
          ROOT = os.path.abspath('targets/reportcards/dist/dev-id')
          class Handler(http.server.SimpleHTTPRequestHandler):
              def translate_path(self, path):
                  original = super().translate_path(path)
                  rel = os.path.relpath(original, os.getcwd())
                  return os.path.join(ROOT, rel)
              def do_GET(self):
                  clean = self.path.split('?', 1)[0].split('#', 1)[0]
                  candidate = os.path.join(ROOT, clean.lstrip('/'))
                  if clean != '/' and not os.path.exists(candidate):
                      self.path = '/index.html'
                  return super().do_GET()
              def end_headers(self):
                  self.send_header('Cache-Control', 'no-store')
                  super().end_headers()
          os.chdir(ROOT)
          with socketserver.TCPServer(('127.0.0.1', 4200), Handler) as httpd:
              httpd.serve_forever()
          PY
          nohup python3 spa_server.py > artifacts/logs/reportcards-static-server.log 2>&1 &
          echo $! > artifacts/logs/reportcards-static-server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4200/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/logs/reportcards-static-server.log
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.1'

      - name: Install isolated browser runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runner
          cp qa/siti-oss-validation/reportcards_e2e.mjs runner/audit.mjs
          cd runner
          npm init -y >/dev/null
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Execute downstream terminal, duplicate, network-loss, and image scenarios
        id: e2e
        continue-on-error: true
        working-directory: runner
        env:
          REPORTCARDS_URL: http://127.0.0.1:4200
          SITI_SERVER_URL: http://127.0.0.1:8001
          SITI_VALIDATION_OUT: ${{ github.workspace }}/artifacts/reportcards-e2e
        shell: bash
        run: |
          set +e
          node audit.mjs | tee ../artifacts/logs/reportcards-e2e-console.log
          code=${PIPESTATUS[0]}
          echo "$code" > ../artifacts/reportcards-e2e-exit-code.txt
          exit "$code"

      - name: Capture evidence and database end state
        if: always()
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set +e
          psql -h 127.0.0.1 -U postgres -d cognicity_reportcards_downstream \
            -c 'SELECT count(*) AS cards FROM grasp.cards; SELECT count(*) AS reports FROM grasp.reports; SELECT count(*) AS all_reports FROM cognicity.all_reports;' \
            > artifacts/database-end-state.txt 2>&1
          find artifacts -type f -printf '%P\t%s bytes\n' | sort > artifacts/ARTIFACT-INDEX.txt
          find artifacts -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS.txt
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siti-oss-reportcards-downstream-final
          path: artifacts
          retention-days: 14
          if-no-files-found: error

      - name: Fail closed if the patched base success scenario did not persist
        if: always()
        shell: bash
        run: |
          code=$(cat artifacts/reportcards-e2e-exit-code.txt 2>/dev/null || echo 99)
          [ "$code" -eq 0 ] || {
            echo "Patched downstream terminal flow failed (exit $code). Evidence was uploaded."
            exit 1
          }
