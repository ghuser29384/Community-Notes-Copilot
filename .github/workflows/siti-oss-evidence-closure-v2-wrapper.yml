name: Siti OSS evidence closure v2 wrapper

on:
  pull_request:
    paths:
      - '.github/workflows/siti-oss-evidence-closure-v2-wrapper.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: siti-oss-evidence-closure-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence-closure-wrapper:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgis/postgis:13-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Execute the evidence-closure script with strict closure patches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          BOOT="$GITHUB_WORKSPACE/bootstrap"
          git clone --single-branch --branch "$HEAD_BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$BOOT"
          export BOOT
          python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import textwrap

          source_commit = 'a3ddd632b5985adf1a7abefa9ba32b376e69c10e'
          source_path = '.github/workflows/siti-oss-evidence-closure-v2-pure.yml'
          source_text = subprocess.check_output(
              ['git', '-C', os.environ['BOOT'], 'show', f'{source_commit}:{source_path}'],
              text=True,
          )
          lines = source_text.splitlines()
          marker = next(i for i, line in enumerate(lines) if line.strip() == 'run: |')
          script = textwrap.dedent('\n'.join(lines[marker + 1:])) + '\n'

          cors_block = """s3.put_bucket_cors(
              Bucket=bucket,
              CORSConfiguration={
                  'CORSRules': [{
                      'AllowedHeaders': ['*'],
                      'AllowedMethods': ['GET', 'HEAD', 'PUT'],
                      'AllowedOrigins': ['http://127.0.0.1:4200'],
                      'ExposeHeaders': ['ETag'],
                      'MaxAgeSeconds': 3600,
                  }]
              },
          )
          """
          if script.count(cors_block) != 1:
              raise RuntimeError(f'expected one MinIO-incompatible PutBucketCors block, found {script.count(cors_block)}')
          script = script.replace(
              cors_block,
              "# MinIO API CORS is configured by MINIO_API_CORS_ALLOW_ORIGIN;\n# this image does not implement the S3 PutBucketCors API.\n",
              1,
          )

          final_harness_command = """SITI_BROWSER_HARNESS="$REPO/runner/audit-v2.mjs" \\
            python qa/siti-oss-highest/patch_final_browser_harness.py \\
            > artifacts/logs/patch-final-harness.log
          SITI_BROWSER_HARNESS="$REPO/runner/audit-v2.mjs" \\
            python qa/siti-oss-evidence-closure-v2/patch_audit_v2.py \\
            > artifacts/logs/patch-evidence-closure-v2.log
          """
          adapted_harness_command = """SITI_BROWSER_HARNESS="$REPO/runner/audit-v2.mjs" \\
            python qa/siti-oss-highest/patch_final_browser_harness.py \\
            > artifacts/logs/patch-final-harness.log
          python - <<'PY2'
          from pathlib import Path
          path = Path('qa/siti-oss-evidence-closure-v2/patch_audit_v2.py')
          text = path.read_text(encoding='utf-8')
          old = """  const context = await browser.newContext({
            viewport: scenario.viewport || { width: 1365, height: 900 },
            geolocation: { latitude: -6.175392, longitude: 106.827153 },
            permissions: ['geolocation'],
          });"""
          styled = """  const context = await browser.newContext({
            viewport: scenario.viewport || { width: 1365, height: 900 },
            isMobile: Boolean(scenario.viewport && scenario.viewport.width <= 480),
            hasTouch: Boolean(scenario.viewport && scenario.viewport.width <= 480),
            deviceScaleFactor: scenario.viewport && scenario.viewport.width <= 480 ? 2 : 1,
            geolocation: { latitude: -6.175392, longitude: 106.827153 },
            permissions: ['geolocation'],
          });"""
          if text.count(old) != 1:
              raise RuntimeError(f'expected one original mobile anchor in helper, found {text.count(old)}')
          path.write_text(text.replace(old, styled, 1), encoding='utf-8')
          PY2
          SITI_BROWSER_HARNESS="$REPO/runner/audit-v2.mjs" \\
            python qa/siti-oss-evidence-closure-v2/patch_audit_v2.py \\
            > artifacts/logs/patch-evidence-closure-v2.log
          """
          if script.count(final_harness_command) != 1:
              raise RuntimeError(f'expected one final harness command block, found {script.count(final_harness_command)}')
          script = script.replace(final_harness_command, adapted_harness_command, 1)

          core_tail = """    storage['object_count'] >= 2 and
              result['fresh_patch_application_and_builds']
          )
          """
          strict_tail = """    storage['object_count'] >= 2 and
              result['fresh_patch_application_and_builds'] and
              focused_unit_exit == 0
          )
          """
          if script.count(core_tail) != 1:
              raise RuntimeError(f'expected one core-pass tail, found {script.count(core_tail)}')
          script = script.replace(core_tail, strict_tail, 1)

          output = Path('/tmp/siti-oss-evidence-closure-v2.sh')
          output.write_text(script, encoding='utf-8')
          print({
              'source_commit': source_commit,
              'source_path': source_path,
              'output': str(output),
              'bytes': output.stat().st_size,
              'focused_unit_required': True,
              'styled_mobile_anchor_adapted': True,
          })
          PY
          bash /tmp/siti-oss-evidence-closure-v2.sh