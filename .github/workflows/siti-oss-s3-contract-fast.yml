name: Siti OSS focused S3 content-type contract

on:
  pull_request:
    paths:
      - '.github/workflows/siti-oss-s3-contract-fast.yml'
      - 'qa/siti-oss-highest/apply_completion_fixes.py'
      - 'qa/siti-oss-highest/s3_signature_contract.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s3-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      postgres:
        image: postgis/postgis:13-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Materialize helpers and clone exact sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 3899fa0720639af6eacbf1ffe10d940ceebad366
          mkdir -p qa/siti-oss-final targets artifacts/{logs,s3-contract}
          for file in apply_candidate_fixes.py apply_gate_fixes_v2.py apply_gate_fixes_v3.py audit_compatibility.sql; do
            git show 3899fa0720639af6eacbf1ffe10d940ceebad366:qa/siti-oss-final/$file > qa/siti-oss-final/$file
          done
          git clone https://github.com/petabencana/sitioss-schema.git targets/schema
          git -C targets/schema checkout 091229bff2a299c31b814979008ebc6df7b428e8
          git clone https://github.com/petabencana/-Depricated-sitioss-server.git targets/server
          git -C targets/server checkout 933f345801340027181be21d24671146e3785701
          git clone https://github.com/petabencana/sitioss-reportcards-ng.git targets/reportcards
          git -C targets/reportcards checkout eaec8b1a2bfe15745077c0e8ad5ff69fbdccc552
      - uses: actions/setup-node@v4
        with:
          node-version: '10.24.1'
      - name: Build patched isolated backend
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: cognicity_s3_contract
          PG_DEFAULT_DB: postgres
          COUNTRY: id
          DATA: 'true'
          FUNCTIONS: 'true'
          SCHEMA: 'true'
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y postgresql-client
          cd targets/schema
          npm install --no-audit --no-fund > ../../artifacts/logs/schema-npm-install.log 2>&1
          ./build/run.sh > ../../artifacts/logs/schema-build.log 2>&1
          cd ../..
          psql -h 127.0.0.1 -U postgres -d cognicity_s3_contract -v ON_ERROR_STOP=1 \
            -f qa/siti-oss-final/audit_compatibility.sql > artifacts/logs/compatibility.log 2>&1
          SITI_LEGACY_AUDIT_SCRIPTS="$PWD/qa/siti-oss-final" \
          SITI_SERVER_SOURCE="$PWD/targets/server" SITI_REPORTCARDS_SOURCE="$PWD/targets/reportcards" \
            python qa/siti-oss-highest/apply_completion_fixes.py > artifacts/logs/apply.log
          cd targets/server
          NODE_ENV=development npm install --production=false --no-audit --no-fund > ../../artifacts/logs/server-install.log 2>&1
          npm run build > ../../artifacts/logs/server-build.log 2>&1
      - name: Start MinIO and bucket
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name siti-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin123 \
            minio/minio:latest server /data
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then break; fi
            sleep 1
          done
          node <<'NODE'
          const AWS=require('./targets/server/node_modules/aws-sdk');
          const s3=new AWS.S3({accessKeyId:'minioadmin',secretAccessKey:'minioadmin123',signatureVersion:'v4',region:'us-east-1',endpoint:'http://127.0.0.1:9000',s3ForcePathStyle:true});
          s3.createBucket({Bucket:'petabencana-image-uploads'}).promise().catch(error=>{console.error(error);process.exit(1)});
          NODE
      - name: Start backend
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: cognicity_s3_contract
          PGSSL: 'false'
          PGTIMEOUT: '30000'
          PORT: '8001'
          LOG_CONSOLE: 'true'
          LOG_DIR: /tmp
          LOG_LEVEL: error
          CORS: 'true'
          SECURE_AUTH0: 'true'
          AUTH0_SECRET: local-validation-secret
          AUTH0_CLIENT_ID: local-validation-client
          NOTIFY_ENDPOINT: http://127.0.0.1:8999/notify/
          NOTIFY_API_KEY: local-validation
          AWS_REGION: us-east-1
          AWS_S3_ACCESS_KEY_ID: minioadmin
          AWS_S3_SECRET_ACCESS_KEY: minioadmin123
          AWS_SIGNATURE_VERSION: v4
          AWS_S3_ENDPOINT: http://127.0.0.1:9000
          AWS_S3_FORCE_PATH_STYLE: 'true'
          IMAGES_BUCKET: petabencana-image-uploads
          IMAGES_HOST: images.petabencana.invalid
          IMAGE_MIME_TYPES: image/png,image/jpeg
        run: |
          set -euo pipefail
          cat > notify_stub.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def do_POST(self): self.send_response(200); self.end_headers()
              def log_message(self, fmt, *args): pass
          HTTPServer(('127.0.0.1',8999),H).serve_forever()
          PY
          nohup python3 notify_stub.py >/dev/null 2>&1 &
          NODE_ENV=production nohup node targets/server/dist > artifacts/logs/server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8001/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/logs/server.log; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.1'
      - name: Enforce matching, mismatched and omitted Content-Type behavior
        shell: bash
        env:
          SITI_SERVER_URL: http://127.0.0.1:8001
          SITI_S3_CONTRACT_OUT: ${{ github.workspace }}/artifacts/s3-contract
        run: |
          set -euo pipefail
          node qa/siti-oss-highest/s3_signature_contract.mjs | tee artifacts/logs/s3-contract.log
      - name: Capture evidence
        if: always()
        shell: bash
        run: |
          set +e
          docker logs siti-minio > artifacts/logs/minio.log 2>&1
          find artifacts -type f -printf '%P\t%s bytes\n' | sort > artifacts/ARTIFACT-INDEX.txt
          find artifacts -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siti-oss-s3-contract-fast
          path: artifacts
          retention-days: 14
          if-no-files-found: error
