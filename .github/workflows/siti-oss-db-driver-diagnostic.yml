name: Siti OSS legacy DB driver diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/siti-oss-db-driver-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgis/postgis:14-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '14.21.3'
      - name: Clone exact sources and build schema
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y postgresql-client
          mkdir -p targets artifacts
          git clone https://github.com/petabencana/sitioss-schema.git targets/schema
          git -C targets/schema checkout 091229bff2a299c31b814979008ebc6df7b428e8
          git clone https://github.com/petabencana/-Depricated-sitioss-server.git targets/server
          git -C targets/server checkout 933f345801340027181be21d24671146e3785701
          cd targets/schema
          npm install --no-audit --no-fund
          PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=cognicity_driver_diag PG_DEFAULT_DB=postgres COUNTRY=id DATA=true FUNCTIONS=true SCHEMA=true ./build/run.sh > ../../artifacts/schema-build.log 2>&1
          psql -h 127.0.0.1 -U postgres -d postgres -c 'ALTER ROLE postgres SET search_path TO cognicity, public;'
      - name: Diagnose lockfile install
        working-directory: targets/server
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: cognicity_driver_diag
        shell: bash
        run: |
          set +e
          NODE_ENV=development npm install --production=false --no-audit --no-fund > ../../artifacts/lock-install.log 2>&1
          npm ls pg-promise pg bluebird --depth=2 > ../../artifacts/lock-dependency-tree.txt 2>&1
          node - <<'NODE' > ../../artifacts/lock-diagnostic.json 2> ../../artifacts/lock-diagnostic.stderr
          const fs=require('fs');
          const out={};
          const cfg={host:process.env.PGHOST,port:Number(process.env.PGPORT),user:process.env.PGUSER,password:process.env.PGPASSWORD,database:process.env.PGDATABASE,ssl:false,connectionTimeoutMillis:5000};
          async function main(){
            try { const pg=require('pg'); out.pg_version=require('pg/package.json').version; const c=new pg.Client(cfg); await c.connect(); out.pg_query=await c.query('select 1 as ok'); await c.end(); } catch(e){ out.pg_error={message:e.message,stack:e.stack}; }
            try { const B=require('bluebird'); const p=require('pg-promise/package.json'); out.pgp_version=p.version; const pgp=require('pg-promise')({promiseLib:B}); const uri=`postgres://${cfg.user}:${cfg.password}@${cfg.host}:${cfg.port}/${cfg.database}?ssl=false`; const db=pgp(uri); out.pgp_query=await db.one('select 1 as ok').timeout(8000); out.pgp_proc=await db.proc('version').timeout(8000); pgp.end(); } catch(e){ out.pgp_error={message:e.message,stack:e.stack}; }
            fs.writeFileSync('../../artifacts/lock-diagnostic-result.json',JSON.stringify(out,null,2)); console.log(JSON.stringify(out,null,2));
          }
          main().catch(e=>{console.error(e);process.exitCode=1});
          NODE
          echo $? > ../../artifacts/lock-diagnostic-exit-code.txt
          exit 0
      - name: Diagnose manifest-only compatible install
        working-directory: targets/server
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: cognicity_driver_diag
        shell: bash
        run: |
          set +e
          rm -rf node_modules
          mv package-lock.json package-lock.audit-saved.json
          NODE_ENV=development npm install --production=false --package-lock=false --no-audit --no-fund > ../../artifacts/manifest-install.log 2>&1
          npm ls pg-promise pg bluebird --depth=2 > ../../artifacts/manifest-dependency-tree.txt 2>&1
          node - <<'NODE' > ../../artifacts/manifest-diagnostic.json 2> ../../artifacts/manifest-diagnostic.stderr
          const fs=require('fs');
          const out={};
          const cfg={host:process.env.PGHOST,port:Number(process.env.PGPORT),user:process.env.PGUSER,password:process.env.PGPASSWORD,database:process.env.PGDATABASE,ssl:false,connectionTimeoutMillis:5000};
          async function main(){
            try { const pg=require('pg'); out.pg_version=require('pg/package.json').version; const c=new pg.Client(cfg); await c.connect(); out.pg_query=await c.query('select 1 as ok'); await c.end(); } catch(e){ out.pg_error={message:e.message,stack:e.stack}; }
            try { const B=require('bluebird'); out.pgp_version=require('pg-promise/package.json').version; const pgp=require('pg-promise')({promiseLib:B}); const uri=`postgres://${cfg.user}:${cfg.password}@${cfg.host}:${cfg.port}/${cfg.database}?ssl=false`; const db=pgp(uri); out.pgp_query=await db.one('select 1 as ok').timeout(8000); out.pgp_proc=await db.proc('version').timeout(8000); pgp.end(); } catch(e){ out.pgp_error={message:e.message,stack:e.stack}; }
            fs.writeFileSync('../../artifacts/manifest-diagnostic-result.json',JSON.stringify(out,null,2)); console.log(JSON.stringify(out,null,2));
          }
          main().catch(e=>{console.error(e);process.exitCode=1});
          NODE
          echo $? > ../../artifacts/manifest-diagnostic-exit-code.txt
          exit 0
      - name: Index and upload evidence
        if: always()
        shell: bash
        run: |
          find artifacts -type f -printf '%P\t%s bytes\n' | sort > artifacts/ARTIFACT-INDEX.txt
          find artifacts -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siti-oss-db-driver-diagnostic
          path: artifacts
          retention-days: 14
          if-no-files-found: error
