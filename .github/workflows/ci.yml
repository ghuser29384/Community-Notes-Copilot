name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall apps/api/app apps/api/tests

      - name: Run unit tests
        run: make test

      - name: Run fixture end-to-end flow
        run: make e2e

      - name: Check browser JavaScript syntax
        run: |
          node --check apps/web/app/app.js
          node --check apps/web/app/submission-metadata.js
