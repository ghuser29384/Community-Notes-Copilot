name: Siti OSS current live read-only deep audit

on:
  pull_request:
    paths:
      - '.github/workflows/siti-oss-live-current.yml'
      - 'qa/siti-oss-highest-level/live-current-audit.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated Playwright dependencies
        run: |
          mkdir -p runner
          cp qa/siti-oss-highest-level/live-current-audit.mjs runner/
          cd runner
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.54.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Run current production read-only scenarios
        working-directory: runner
        env:
          AUDIT_OUTPUT: ${{ github.workspace }}/artifacts
        run: node live-current-audit.mjs
      - name: Verify outputs and package evidence
        run: |
          test -s artifacts/live-current-audit.json
          find artifacts -type f -printf '%P\t%s bytes\n' | sort > artifacts/ARTIFACT-INDEX.txt
          find artifacts -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: siti-oss-current-live-readonly
          path: artifacts
          retention-days: 14
          if-no-files-found: error
