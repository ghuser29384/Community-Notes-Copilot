name: Siti OSS runtime error diagnostic 2026-08-04

on:
  pull_request:
    paths:
      - '.github/workflows/siti-oss-runtime-diagnostic-20260804.yml'
      - 'qa/siti-oss-highest/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    services:
      postgres:
        image: postgis/postgis:13-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Materialize reviewed audit scripts from immutable QA head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 3899fa0720639af6eacbf1ffe10d940ceebad366
          mkdir -p qa/siti-oss-final
          for file in \
            apply_candidate_fixes.py \
            apply_gate_fixes_v2.py \
            apply_gate_fixes_v3.py \
            audit_compatibility.sql; do
            git show 3899fa0720639af6eacbf1ffe10d940ceebad366:qa/siti-oss-final/$file \
              > qa/siti-oss-final/$file
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '10.24.1'

      - name: Build exact patched backend
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: cognicity_runtime_diagnostic
          PG_DEFAULT_DB: postgres
          COUNTRY: id
          DATA: 'true'
          FUNCTIONS: 'true'
          SCHEMA: 'true'
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y postgresql-client
          mkdir -p targets artifacts/logs artifacts/runtime-diagnostic runner
          git clone https://github.com/petabencana/sitioss-schema.git targets/schema
          git -C targets/schema checkout 091229bff2a299c31b814979008ebc6df7b428e8
          git clone https://github.com/petabencana/-Depricated-sitioss-server.git targets/server
          git -C targets/server checkout 933f345801340027181be21d24671146e3785701
          git clone https://github.com/petabencana/sitioss-reportcards-ng.git targets/reportcards
          git -C targets/reportcards checkout eaec8b1a2bfe15745077c0e8ad5ff69fbdccc552

          cd targets/schema
          npm install --no-audit --no-fund > ../../artifacts/logs/schema-npm-install.log 2>&1
          ./build/run.sh > ../../artifacts/logs/schema-build.log 2>&1
          cd ../..
          psql -h 127.0.0.1 -U postgres -d cognicity_runtime_diagnostic \
            -v ON_ERROR_STOP=1 -f qa/siti-oss-final/audit_compatibility.sql \
            > artifacts/logs/compatibility-migration.log 2>&1

          SITI_SERVER_SOURCE="$PWD/targets/server" \
          SITI_REPORTCARDS_SOURCE="$PWD/targets/reportcards" \
            python qa/siti-oss-final/apply_gate_fixes_v3.py \
            > artifacts/logs/apply-gate-fixes.log

          cd targets/server
          NODE_ENV=development npm install --production=false --no-audit --no-fund \
            > ../../artifacts/logs/server-npm-install.log 2>&1
          npm run build > ../../artifacts/logs/server-build.log 2>&1

      - name: Start patched backend
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: cognicity_runtime_diagnostic
          PGSSL: 'false'
          PGTIMEOUT: '30000'
          PORT: '8001'
          LOG_CONSOLE: 'true'
          LOG_DIR: /tmp
          LOG_LEVEL: error
          CORS: 'true'
          SECURE_AUTH0: 'true'
          AUTH0_SECRET: local-validation-secret
          AUTH0_CLIENT_ID: local-validation-client
          NOTIFY_ENDPOINT: http://127.0.0.1:8999/notify/
          NOTIFY_API_KEY: local-validation
          AWS_REGION: ap-southeast-1
          AWS_S3_ACCESS_KEY_ID: local-validation-key
          AWS_S3_SECRET_ACCESS_KEY: local-validation-secret
          AWS_SIGNATURE_VERSION: v4
        run: |
          set -euo pipefail
          cat > notify_stub.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  length=int(self.headers.get('content-length','0'))
                  if length: self.rfile.read(length)
                  self.send_response(200); self.end_headers(); self.wfile.write(b'{"ok":true}')
              def log_message(self, fmt, *args): pass
          HTTPServer(('127.0.0.1',8999),Handler).serve_forever()
          PY
          nohup python3 notify_stub.py > artifacts/logs/notify-stub.log 2>&1 &
          NODE_ENV=production nohup node targets/server/dist > artifacts/logs/server.log 2>&1 &
          echo $! > artifacts/logs/server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8001/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/logs/server.log
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '14.21.3'

      - name: Build patched Report Cards development bundle
        working-directory: targets/reportcards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ['environment.json','environment.prod.json']:
              path=Path('src/environments/id')/name
              data=json.loads(path.read_text())
              data['data_server']='http://127.0.0.1:8001/'
              data['app']='http://127.0.0.1:4200/'
              path.write_text(json.dumps(data,indent=2))
          PY
          npm install --no-audit --no-fund > ../../artifacts/logs/reportcards-npm-install.log 2>&1
          npm run build-dev-id > ../../artifacts/logs/reportcards-build-dev.log 2>&1
          grep -RIn --include='*.js' -E '(^|[^A-Za-z0-9_$])exports([.[]|\s*=)' dist/dev-id \
            > ../../artifacts/runtime-diagnostic/exports-token-locations.txt || true

      - name: Start SPA with history fallback
        shell: bash
        run: |
          set -euo pipefail
          cat > spa_server.py <<'PY'
          import http.server, os, socketserver
          ROOT=os.path.abspath('targets/reportcards/dist/dev-id')
          class Handler(http.server.SimpleHTTPRequestHandler):
              def translate_path(self,path):
                  original=super().translate_path(path)
                  rel=os.path.relpath(original,os.getcwd())
                  return os.path.join(ROOT,rel)
              def do_GET(self):
                  clean=self.path.split('?',1)[0].split('#',1)[0]
                  candidate=os.path.join(ROOT,clean.lstrip('/'))
                  if clean!='/' and not os.path.exists(candidate): self.path='/index.html'
                  return super().do_GET()
              def end_headers(self):
                  self.send_header('Cache-Control','no-store')
                  super().end_headers()
          os.chdir(ROOT)
          with socketserver.TCPServer(('127.0.0.1',4200),Handler) as httpd: httpd.serve_forever()
          PY
          nohup python3 spa_server.py > artifacts/logs/reportcards-static-server.log 2>&1 &
          echo $! > artifacts/logs/reportcards-static-server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4200/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.1'

      - name: Run browser runtime diagnostic
        working-directory: runner
        shell: bash
        env:
          REPORTCARDS_URL: http://127.0.0.1:4200
          SITI_SERVER_URL: http://127.0.0.1:8001
          SITI_DIAGNOSTIC_OUT: ${{ github.workspace }}/artifacts/runtime-diagnostic
        run: |
          set -euo pipefail
          cp ../qa/siti-oss-highest/runtime_diagnostic.mjs ./runtime_diagnostic.mjs
          npm init -y >/dev/null
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
          node runtime_diagnostic.mjs | tee ../artifacts/logs/runtime-diagnostic-console.log

      - name: Capture evidence
        if: always()
        shell: bash
        run: |
          set +e
          find artifacts -type f -printf '%P\t%s bytes\n' | sort > artifacts/ARTIFACT-INDEX.txt
          find artifacts -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS.txt
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siti-oss-runtime-diagnostic-20260804
          path: artifacts
          retention-days: 14
          if-no-files-found: error
