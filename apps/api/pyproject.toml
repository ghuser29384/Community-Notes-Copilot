[project]
name = "community-notes-ai-writer-ops-api"
version = "0.1.0"
description = "Fixture-first API and operations layer around X Community Notes AI Note Writer workflows"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "uvicorn>=0.30"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "respx>=0.21"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

