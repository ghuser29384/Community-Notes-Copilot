name: Siti OSS corrected write and load validation v6

on:
  pull_request:
    paths:
      - '.github/workflows/siti-oss-write-load-v6.yml'
      - 'qa/siti-oss-validation/server_validation.py'
      - 'qa/siti-oss-validation/server_validation_corrected.py'
      - 'qa/siti-oss-validation/audit_compatibility.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  write-and-load:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgis/postgis:13-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '10.24.1'
      - name: Build exact public schema and server with audit-only compatibility migration
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y postgresql-client
          mkdir -p targets artifacts/logs artifacts/server-validation
          git clone https://github.com/petabencana/sitioss-schema.git targets/schema
          git -C targets/schema checkout 091229bff2a299c31b814979008ebc6df7b428e8
          git clone https://github.com/petabencana/-Depricated-sitioss-server.git targets/server
          git -C targets/server checkout 933f345801340027181be21d24671146e3785701
          git -C targets/schema show -s --format='%H%x09%cI%x09%s' > artifacts/schema-commit.tsv
          git -C targets/server show -s --format='%H%x09%cI%x09%s' > artifacts/server-commit.tsv
          cp qa/siti-oss-validation/audit_compatibility.sql artifacts/audit_compatibility.sql
          cd targets/schema
          npm install --no-audit --no-fund
          PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=cognicity_write_validation PG_DEFAULT_DB=postgres COUNTRY=id DATA=true FUNCTIONS=true SCHEMA=true ./build/run.sh > ../../artifacts/logs/schema-build.log 2>&1
          cd ../..
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d cognicity_write_validation -v ON_ERROR_STOP=1 -f qa/siti-oss-validation/audit_compatibility.sql > artifacts/logs/compatibility-migration.log 2>&1
          cd targets/server
          NODE_ENV=development npm install --production=false --no-audit --no-fund > ../../artifacts/logs/server-npm-install.log 2>&1
          npm run build > ../../artifacts/logs/server-build.log 2>&1
      - name: Start exact legacy server with isolated notification stub
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: cognicity_write_validation
          PGSSL: 'false'
          PGTIMEOUT: '30000'
          PORT: '8001'
          LOG_CONSOLE: 'true'
          LOG_DIR: /tmp
          LOG_LEVEL: error
          CORS: 'true'
          SECURE_AUTH0: 'true'
          AUTH0_SECRET: local-validation-secret
          AUTH0_CLIENT_ID: local-validation-client
          NOTIFY_ENDPOINT: http://127.0.0.1:8999/notify/
          NOTIFY_API_KEY: local-validation
          AWS_REGION: ap-southeast-1
          AWS_S3_ACCESS_KEY_ID: local-validation-key
          AWS_S3_SECRET_ACCESS_KEY: local-validation-secret
          AWS_SIGNATURE_VERSION: v4
        shell: bash
        run: |
          set -euo pipefail
          cat > notify_stub.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  length=int(self.headers.get('content-length','0'))
                  if length: self.rfile.read(length)
                  self.send_response(200); self.send_header('content-type','application/json'); self.end_headers(); self.wfile.write(b'{"ok":true}')
              def log_message(self, fmt, *args): pass
          HTTPServer(('127.0.0.1',8999),Handler).serve_forever()
          PY
          nohup python3 notify_stub.py > artifacts/logs/notify-stub.log 2>&1 &
          NODE_ENV=production nohup node targets/server/dist > artifacts/logs/server.log 2>&1 &
          echo $! > artifacts/logs/server.pid
          for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:8001/ >/dev/null; then exit 0; fi; sleep 1; done
          cat artifacts/logs/server.log; exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run corrected sequential/concurrent duplicate, 10k read, 1k write, image-preflight and REM checks
        env:
          SITI_SERVER_URL: http://127.0.0.1:8001
          SITI_VALIDATION_OUT: ${{ github.workspace }}/artifacts/server-validation
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: cognicity_write_validation
          DUPLICATE_CONCURRENCY: '50'
          READ_LOAD_REQUESTS: '10000'
          READ_LOAD_CONCURRENCY: '100'
          WRITE_LOAD_REQUESTS: '1000'
          WRITE_LOAD_CONCURRENCY: '50'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests psycopg2-binary
          python qa/siti-oss-validation/server_validation_corrected.py | tee artifacts/logs/server-validation-console.log
      - name: Capture and upload evidence
        if: always()
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set +e
          psql -h 127.0.0.1 -U postgres -d cognicity_write_validation -c 'SELECT count(*) AS cards FROM grasp.cards; SELECT count(*) AS reports FROM grasp.reports; SELECT count(*) AS all_reports FROM cognicity.all_reports; SELECT count(*) AS rem_log_rows FROM cognicity.rem_status_log;' > artifacts/database-end-state.txt 2>&1
          find artifacts -type f -printf '%P\t%s bytes\n' | sort > artifacts/ARTIFACT-INDEX.txt
          find artifacts -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siti-oss-corrected-write-load-v6
          path: artifacts
          retention-days: 14
          if-no-files-found: error
