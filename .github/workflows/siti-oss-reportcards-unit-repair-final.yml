name: Siti OSS Report Cards final unit-test repair

on:
  pull_request:
    paths:
      - '.github/workflows/siti-oss-reportcards-unit-repair-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-final-unit-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '14.21.3'
      - name: Clone exact public target
        run: |
          mkdir -p artifacts
          git clone https://github.com/petabencana/sitioss-reportcards-ng.git target
          git -C target checkout eaec8b1a2bfe15745077c0e8ad5ff69fbdccc552
      - name: Reproduce baseline and verify an exact Jasmine type pin
        shell: bash
        run: |
          set +e
          cd target
          npm --version > ../artifacts/npm-version.txt
          npm ci --no-audit --no-fund > ../artifacts/npm-install.txt 2>&1
          install_ec=$?; echo "$install_ec" > ../artifacts/npm-install-exit-code.txt
          dep=id npm run pre-build-tasks > ../artifacts/pre-build.txt 2>&1
          pre_ec=$?; echo "$pre_ec" > ../artifacts/pre-build-exit-code.txt
          timeout 15m npm test -- --watch=false --browsers=ChromeHeadless > ../artifacts/unit-baseline.txt 2>&1
          baseline_ec=$?; echo "$baseline_ec" > ../artifacts/unit-baseline-exit-code.txt

          npm install --save-dev --save-exact --no-audit --no-fund @types/jasmine@2.8.8 > ../artifacts/pin-install.txt 2>&1
          pin_ec=$?; echo "$pin_ec" > ../artifacts/pin-install-exit-code.txt
          dep=id npm run pre-build-tasks > ../artifacts/pre-build-after-pin.txt 2>&1
          pre_after_ec=$?; echo "$pre_after_ec" > ../artifacts/pre-build-after-pin-exit-code.txt
          timeout 15m npm test -- --watch=false --browsers=ChromeHeadless > ../artifacts/unit-after-pin.txt 2>&1
          after_ec=$?; echo "$after_ec" > ../artifacts/unit-after-pin-exit-code.txt
          git diff -- package.json package-lock.json > ../artifacts/jasmine-types-pin.patch
          git status --short > ../artifacts/status.txt
          exit 0
      - name: Package evidence before gate
        if: always()
        run: |
          find artifacts -type f -printf '%P\t%s bytes\n' | sort > artifacts/ARTIFACT-INDEX.txt
          find artifacts -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siti-oss-reportcards-final-unit-repair
          path: artifacts
          retention-days: 14
          if-no-files-found: error
      - name: Differential unit-test gate
        if: always()
        run: |
          test "$(cat artifacts/npm-install-exit-code.txt)" -eq 0
          test "$(cat artifacts/pre-build-exit-code.txt)" -eq 0
          test "$(cat artifacts/unit-baseline-exit-code.txt)" -ne 0
          test "$(cat artifacts/pin-install-exit-code.txt)" -eq 0
          test "$(cat artifacts/pre-build-after-pin-exit-code.txt)" -eq 0
          test "$(cat artifacts/unit-after-pin-exit-code.txt)" -eq 0
