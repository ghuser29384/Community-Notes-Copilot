name: Siti OSS Gate A final duplicate submission

on:
  pull_request:
    paths:
      - '.github/workflows/siti-oss-gate-a-final.yml'
      - 'qa/siti-oss-final/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duplicate-submission:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      postgres:
        image: postgis/postgis:13-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '10.24.1'

      - name: Build exact isolated stack and apply final gate fixes
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: cognicity_gate_a_final
          PG_DEFAULT_DB: postgres
          COUNTRY: id
          DATA: 'true'
          FUNCTIONS: 'true'
          SCHEMA: 'true'
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y postgresql-client
          mkdir -p targets artifacts/logs artifacts/diffs
          git clone https://github.com/petabencana/sitioss-schema.git targets/schema
          git -C targets/schema checkout 091229bff2a299c31b814979008ebc6df7b428e8
          git clone https://github.com/petabencana/-Depricated-sitioss-server.git targets/server
          git -C targets/server checkout 933f345801340027181be21d24671146e3785701
          git clone https://github.com/petabencana/sitioss-reportcards-ng.git targets/reportcards
          git -C targets/reportcards checkout eaec8b1a2bfe15745077c0e8ad5ff69fbdccc552
          for repo in schema server reportcards; do
            git -C "targets/$repo" show -s --format='%H%x09%cI%x09%s' > "artifacts/${repo}-commit.tsv"
          done

          cd targets/schema
          npm install --no-audit --no-fund > ../../artifacts/logs/schema-npm-install.log 2>&1
          ./build/run.sh > ../../artifacts/logs/schema-build.log 2>&1
          cd ../..
          psql -h 127.0.0.1 -U postgres -d cognicity_gate_a_final \
            -v ON_ERROR_STOP=1 -f qa/siti-oss-final/audit_compatibility.sql \
            > artifacts/logs/compatibility-migration.log 2>&1

          SITI_SERVER_SOURCE="$PWD/targets/server" \
          SITI_REPORTCARDS_SOURCE="$PWD/targets/reportcards" \
            python qa/siti-oss-final/apply_gate_fixes_v2.py \
            > artifacts/logs/apply-final-gate-fixes.log
          git -C targets/server diff --check
          git -C targets/server diff --binary > artifacts/diffs/server-final-gate.patch

          cd targets/server
          NODE_ENV=development npm install --production=false --no-audit --no-fund \
            > ../../artifacts/logs/server-npm-install.log 2>&1
          npm run build > ../../artifacts/logs/server-build.log 2>&1
          cd ../..

      - name: Start patched server and isolated notification stub
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: cognicity_gate_a_final
          PGSSL: 'false'
          PGTIMEOUT: '30000'
          PORT: '8001'
          LOG_CONSOLE: 'true'
          LOG_DIR: /tmp
          LOG_LEVEL: error
          CORS: 'true'
          SECURE_AUTH0: 'true'
          AUTH0_SECRET: local-validation-secret
          AUTH0_CLIENT_ID: local-validation-client
          NOTIFY_ENDPOINT: http://127.0.0.1:8999/notify/
          NOTIFY_API_KEY: local-validation
          AWS_REGION: ap-southeast-1
          AWS_S3_ACCESS_KEY_ID: local-validation-key
          AWS_S3_SECRET_ACCESS_KEY: local-validation-secret
          AWS_SIGNATURE_VERSION: v4
        run: |
          set -euo pipefail
          cat > notify_stub.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('content-length', '0'))
                  if length:
                      self.rfile.read(length)
                  self.send_response(200)
                  self.send_header('content-type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'{"ok":true}')
              def log_message(self, fmt, *args):
                  pass
          HTTPServer(('127.0.0.1', 8999), Handler).serve_forever()
          PY
          nohup python3 notify_stub.py > artifacts/logs/notify-stub.log 2>&1 &
          NODE_ENV=production nohup node targets/server/dist > artifacts/logs/server.log 2>&1 &
          echo $! > artifacts/logs/server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8001/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/logs/server.log
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce 1x200, 49x409, 0x500 and one persisted report
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests psycopg2-binary
          python - <<'PY' | tee artifacts/gate-a-result.json
          import concurrent.futures
          import json
          from collections import Counter
          import psycopg2
          import requests

          base = 'http://127.0.0.1:8001'
          card = requests.post(base + '/cards', json={
              'username': 'gate-a-final-race',
              'network': 'twitter',
              'language': 'en',
              'network_data': {},
          }, timeout=20)
          card.raise_for_status()
          card_id = card.json()['cardId']
          payload = {
              'disaster_type': 'flood',
              'partnerCode': '',
              'tweetID': '',
              'is_training': True,
              'sub_submission': False,
              'card_data': {'report_type': 'flood', 'flood_depth': 44},
              'text': 'Gate A final duplicate submission',
              'image_url': '',
              'created_at': '2026-07-31T05:00:00.000Z',
              'location': {'lat': -6.1754, 'lng': 106.8272},
          }

          def submit(_index):
              response = requests.put(base + '/cards/' + card_id, json=payload, timeout=30)
              try:
                  body = response.json()
              except Exception:
                  body = response.text
              return {'status': response.status_code, 'body': body}

          with concurrent.futures.ThreadPoolExecutor(max_workers=50) as pool:
              results = list(pool.map(submit, range(50)))
          counts = Counter(item['status'] for item in results)

          with psycopg2.connect(
              host='127.0.0.1', port=5432, user='postgres', password='postgres',
              dbname='cognicity_gate_a_final',
          ) as connection:
              with connection.cursor() as cursor:
                  cursor.execute('SELECT count(*) FROM grasp.reports WHERE card_id=%s', (card_id,))
                  report_rows = cursor.fetchone()[0]
                  cursor.execute('SELECT count(*) FROM cognicity.all_reports WHERE card_id=%s', (card_id,))
                  all_report_rows = cursor.fetchone()[0]
                  cursor.execute("SELECT count(*) FROM grasp.log WHERE card_id=%s AND event_type='REPORT SUBMITTED'", (card_id,))
                  submitted_log_rows = cursor.fetchone()[0]

          output = {
              'card_id': card_id,
              'attempts': 50,
              'status_counts': dict(counts),
              'report_rows': report_rows,
              'all_report_rows': all_report_rows,
              'submitted_log_rows': submitted_log_rows,
              'sample_results': results[:15],
          }
          print(json.dumps(output, indent=2))
          assert counts[200] == 1, output
          assert counts[409] == 49, output
          assert counts[500] == 0, output
          assert sum(value for key, value in counts.items() if key not in (200, 409)) == 0, output
          assert report_rows == 1, output
          assert all_report_rows == 1, output
          assert submitted_log_rows == 1, output
          PY

      - name: Capture evidence
        if: always()
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set +e
          psql -h 127.0.0.1 -U postgres -d cognicity_gate_a_final \
            -c 'SELECT count(*) AS cards FROM grasp.cards; SELECT count(*) AS reports FROM grasp.reports; SELECT count(*) AS all_reports FROM cognicity.all_reports;' \
            > artifacts/database-end-state.txt 2>&1
          find artifacts -type f -printf '%P\t%s bytes\n' | sort > artifacts/ARTIFACT-INDEX.txt
          find artifacts -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS.txt
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siti-oss-gate-a-final
          path: artifacts
          retention-days: 14
          if-no-files-found: error
