name: Siti OSS final candidate-only completion

on:
  pull_request:
    paths:
      - '.github/workflows/siti-oss-final-candidate-only.yml'
      - 'qa/siti-oss-highest/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgis/postgis:13-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Materialize reviewed helpers and clone exact sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 3899fa0720639af6eacbf1ffe10d940ceebad366
          mkdir -p qa/siti-oss-final runner artifacts/{logs,candidate,diffs,gate-a,gate-b,s3-contract}
          for file in \
            apply_candidate_fixes.py \
            apply_gate_fixes_v2.py \
            apply_gate_fixes_v3.py \
            audit_compatibility.sql \
            patch_gate_b_harness_v2.py \
            reportcards_fix_e2e.mjs; do
            git show 3899fa0720639af6eacbf1ffe10d940ceebad366:qa/siti-oss-final/$file \
              > qa/siti-oss-final/$file
          done
          git clone https://github.com/petabencana/sitioss-schema.git targets/schema
          git -C targets/schema checkout 091229bff2a299c31b814979008ebc6df7b428e8
          git clone https://github.com/petabencana/-Depricated-sitioss-server.git targets/server
          git -C targets/server checkout 933f345801340027181be21d24671146e3785701
          git clone https://github.com/petabencana/sitioss-reportcards-ng.git targets/reportcards
          git -C targets/reportcards checkout eaec8b1a2bfe15745077c0e8ad5ff69fbdccc552
          for repo in schema server reportcards; do
            git -C "targets/$repo" show -s --format='%H%x09%cI%x09%s' \
              > "artifacts/${repo}-commit.tsv"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '14.21.3'

      - name: Install reproducible Report Cards toolchain
        working-directory: targets/reportcards
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund > ../../artifacts/logs/reportcards-install.log 2>&1
          npm install --save-dev --save-exact @types/jasmine@2.8.16 --no-audit --no-fund \
            > ../../artifacts/logs/reportcards-pin-jasmine.log 2>&1

      - uses: actions/setup-node@v4
        with:
          node-version: '10.24.1'

      - name: Build isolated PostGIS stack and install legacy server
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: cognicity_final_candidate
          PG_DEFAULT_DB: postgres
          COUNTRY: id
          DATA: 'true'
          FUNCTIONS: 'true'
          SCHEMA: 'true'
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y postgresql-client
          cd targets/schema
          npm install --no-audit --no-fund > ../../artifacts/logs/schema-install.log 2>&1
          ./build/run.sh > ../../artifacts/logs/schema-build.log 2>&1
          cd ../..
          psql -h 127.0.0.1 -U postgres -d cognicity_final_candidate \
            -v ON_ERROR_STOP=1 -f qa/siti-oss-final/audit_compatibility.sql \
            > artifacts/logs/compatibility.log 2>&1
          cd targets/server
          NODE_ENV=development npm install --production=false --no-audit --no-fund \
            > ../../artifacts/logs/server-install.log 2>&1

      - name: Apply final product candidate and prepare clean patches
        shell: bash
        run: |
          set -euo pipefail
          SITI_LEGACY_AUDIT_SCRIPTS="$PWD/qa/siti-oss-final" \
          SITI_SERVER_SOURCE="$PWD/targets/server" \
          SITI_REPORTCARDS_SOURCE="$PWD/targets/reportcards" \
            python qa/siti-oss-highest/apply_completion_fixes.py \
            > artifacts/logs/apply-completion.log
          cp qa/siti-oss-final/reportcards_fix_e2e.mjs runner/audit.mjs
          SITI_BROWSER_HARNESS="$PWD/runner/audit.mjs" \
            python qa/siti-oss-final/patch_gate_b_harness_v2.py \
            > artifacts/logs/patch-harness-v2.log
          SITI_BROWSER_HARNESS="$PWD/runner/audit.mjs" \
            python qa/siti-oss-highest/patch_final_browser_harness.py \
            > artifacts/logs/patch-final-harness.log
          git -C targets/server diff --check
          git -C targets/reportcards -c core.whitespace=cr-at-eol diff --check
          git -C targets/server diff --binary > artifacts/diffs/server-final-candidate.patch
          git -C targets/reportcards diff --binary > artifacts/diffs/reportcards-final-candidate.patch

      - name: Adapt only deprecated server test fixtures to its existing contract
        shell: bash
        run: |
          set -euo pipefail
          SITI_SERVER_SOURCE="$PWD/targets/server" \
            python qa/siti-oss-highest/patch_server_test_contract.py \
            > artifacts/logs/patch-server-test-fixtures.log

      - name: Run candidate legacy server engineering checks
        working-directory: targets/server
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: cognicity_final_candidate
          PGSSL: 'false'
          PGTIMEOUT: '30000'
          PORT: '8012'
          LOG_CONSOLE: 'false'
          LOG_DIR: /tmp
          LOG_LEVEL: error
          CORS: 'true'
          SECURE_AUTH0: 'false'
          AUTH0_SECRET: local-validation-secret
          AUTH0_CLIENT_ID: local-validation-client
          NOTIFY_ENDPOINT: http://127.0.0.1:8999/notify/
          NOTIFY_API_KEY: local-validation
          AWS_REGION: us-east-1
          AWS_S3_ACCESS_KEY_ID: minioadmin
          AWS_S3_SECRET_ACCESS_KEY: minioadmin123
          AWS_SIGNATURE_VERSION: v4
        run: |
          set +e
          npm run build > ../../artifacts/candidate/server-build.log 2>&1
          echo $? > ../../artifacts/candidate/server-build.exit
          npm run lint > ../../artifacts/candidate/server-lint.log 2>&1
          echo $? > ../../artifacts/candidate/server-lint.exit
          timeout 15m npm run mocha > ../../artifacts/candidate/server-test.log 2>&1
          echo $? > ../../artifacts/candidate/server-test.exit
          exit 0

      - name: Enforce no regression against recorded exact-source server baseline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          lint=Path('artifacts/candidate/server-lint.log').read_text(errors='replace')
          matches=re.findall(r'✖\s+(\d+)\s+problems',lint)
          lint_count=int(matches[-1]) if matches else 0
          tests=Path('artifacts/candidate/server-test.log').read_text(errors='replace')
          passing=re.findall(r'\b(\d+) passing\b',tests)
          failing=re.findall(r'\b(\d+) failing\b',tests)
          result={
            'recorded_baseline':{
              'source':'siti-oss-highest-final-v2-run1.zip',
              'server_lint_errors':384,
              'server_tests_passing':91,
              'server_tests_failing':11,
            },
            'candidate':{
              'server_lint_errors':lint_count,
              'server_tests_passing':int(passing[-1]) if passing else 0,
              'server_tests_failing':int(failing[-1]) if failing else 0,
            },
          }
          result['pass']=(result['candidate']['server_lint_errors'] <= 384 and result['candidate']['server_tests_passing'] >= 91 and result['candidate']['server_tests_failing'] <= 11)
          Path('artifacts/candidate/server-no-regression.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          assert result['pass'], result
          PY
          git -C targets/server checkout -- src/test/testCards.js

      - name: Start MinIO and create isolated bucket
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name siti-minio -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin123 \
            -e MINIO_API_CORS_ALLOW_ORIGIN=http://127.0.0.1:4200 \
            minio/minio:latest server /data --console-address ':9001'
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null
          node <<'NODE'
          const AWS=require('./targets/server/node_modules/aws-sdk');
          const s3=new AWS.S3({accessKeyId:'minioadmin',secretAccessKey:'minioadmin123',signatureVersion:'v4',region:'us-east-1',endpoint:'http://127.0.0.1:9000',s3ForcePathStyle:true});
          s3.createBucket({Bucket:'petabencana-image-uploads'}).promise().catch(error=>{console.error(error);process.exit(1)});
          NODE

      - name: Start patched backend
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: cognicity_final_candidate
          PGSSL: 'false'
          PGTIMEOUT: '30000'
          PORT: '8001'
          LOG_CONSOLE: 'true'
          LOG_DIR: /tmp
          LOG_LEVEL: error
          CORS: 'true'
          SECURE_AUTH0: 'true'
          AUTH0_SECRET: local-validation-secret
          AUTH0_CLIENT_ID: local-validation-client
          NOTIFY_ENDPOINT: http://127.0.0.1:8999/notify/
          NOTIFY_API_KEY: local-validation
          AWS_REGION: us-east-1
          AWS_S3_ACCESS_KEY_ID: minioadmin
          AWS_S3_SECRET_ACCESS_KEY: minioadmin123
          AWS_SIGNATURE_VERSION: v4
          AWS_S3_ENDPOINT: http://127.0.0.1:9000
          AWS_S3_FORCE_PATH_STYLE: 'true'
          IMAGES_BUCKET: petabencana-image-uploads
          IMAGES_HOST: images.petabencana.invalid
          IMAGE_MIME_TYPES: image/png,image/jpeg
        run: |
          set -euo pipefail
          test "$(cat artifacts/candidate/server-build.exit)" = '0'
          cat > notify_stub.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def do_POST(self): self.send_response(200); self.end_headers()
              def log_message(self, fmt, *args): pass
          HTTPServer(('127.0.0.1',8999),H).serve_forever()
          PY
          nohup python3 notify_stub.py > artifacts/logs/notify-stub.log 2>&1 &
          NODE_ENV=production nohup node targets/server/dist > artifacts/logs/server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8001/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/logs/server.log; exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce stable 50-way duplicate handling
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests psycopg2-binary
          python - <<'PY' | tee artifacts/gate-a/gate-a-result.json
          import concurrent.futures,json,requests,psycopg2
          from collections import Counter
          base='http://127.0.0.1:8001'
          card=requests.post(base+'/cards',json={'username':'final-candidate-duplicate','network':'twitter','language':'en','network_data':{}},timeout=20); card.raise_for_status(); card_id=card.json()['cardId']
          payload={'disaster_type':'flood','partnerCode':'','tweetID':'','is_training':True,'sub_submission':False,'card_data':{'report_type':'flood','flood_depth':44},'text':'final candidate duplicate','image_url':'','created_at':'2026-08-04T04:00:00.000Z','location':{'lat':-6.1754,'lng':106.8272}}
          def submit(_):
              r=requests.put(base+'/cards/'+card_id,json=payload,timeout=30)
              try: body=r.json()
              except Exception: body=r.text
              return {'status':r.status_code,'body':body}
          with concurrent.futures.ThreadPoolExecutor(max_workers=50) as pool: results=list(pool.map(submit,range(50)))
          counts=Counter(r['status'] for r in results)
          with psycopg2.connect(host='127.0.0.1',port=5432,user='postgres',password='postgres',dbname='cognicity_final_candidate') as conn:
              with conn.cursor() as cur:
                  cur.execute('SELECT count(*) FROM grasp.reports WHERE card_id=%s',(card_id,)); reports=cur.fetchone()[0]
                  cur.execute("SELECT count(*) FROM cognicity.all_reports WHERE source='grasp' AND url=%s",(card_id,)); all_reports=cur.fetchone()[0]
                  cur.execute("SELECT count(*) FROM grasp.log WHERE card_id=%s AND event_type='REPORT SUBMITTED'",(card_id,)); logs=cur.fetchone()[0]
          out={'status_counts':dict(counts),'report_rows':reports,'all_report_rows':all_reports,'submitted_log_rows':logs,'sample_results':results[:15]}
          print(json.dumps(out,indent=2))
          assert counts[200] == 1 and counts[409] == 49 and sum(v for k,v in counts.items() if k not in (200,409)) == 0, out
          assert reports == 1 and all_reports == 1 and logs == 1, out
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.1'

      - name: Enforce real S3-compatible Content-Type signature contract
        shell: bash
        env:
          SITI_SERVER_URL: http://127.0.0.1:8001
          SITI_S3_CONTRACT_OUT: ${{ github.workspace }}/artifacts/s3-contract
        run: |
          set -euo pipefail
          node qa/siti-oss-highest/s3_signature_contract.mjs | tee artifacts/logs/s3-contract.log

      - uses: actions/setup-node@v4
        with:
          node-version: '14.21.3'

      - name: Run Report Cards builds, lint and units with real exits
        working-directory: targets/reportcards
        shell: bash
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ['environment.json','environment.prod.json']:
              path=Path('src/environments/id')/name
              data=json.loads(path.read_text()); data['data_server']='http://127.0.0.1:8001/'; data['app']='http://127.0.0.1:4200/'; path.write_text(json.dumps(data,indent=2))
          PY
          set +e
          npm run build-dev-id > ../../artifacts/candidate/reportcards-build-dev.log 2>&1; echo $? > ../../artifacts/candidate/reportcards-build-dev.exit
          npm run build-prod-id > ../../artifacts/candidate/reportcards-build-prod.log 2>&1; echo $? > ../../artifacts/candidate/reportcards-build-prod.exit
          npm run lint > ../../artifacts/candidate/reportcards-lint.log 2>&1; echo $? > ../../artifacts/candidate/reportcards-lint.exit
          timeout 15m npm test -- --watch=false --browsers=ChromeHeadless > ../../artifacts/candidate/reportcards-unit.log 2>&1; echo $? > ../../artifacts/candidate/reportcards-unit.exit
          exit 0

      - name: Enforce Report Cards build, unit and lint-debt criteria
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          def code(name): return int(Path('artifacts/candidate',name).read_text().strip())
          lint=sum(1 for line in Path('artifacts/candidate/reportcards-lint.log').read_text(errors='replace').splitlines() if line.startswith('ERROR:'))
          result={'build_dev':code('reportcards-build-dev.exit'),'build_prod':code('reportcards-build-prod.exit'),'unit':code('reportcards-unit.exit'),'lint_errors':lint,'recorded_exact_source_lint_baseline':1086}
          result['pass']=(result['build_dev']==0 and result['build_prod']==0 and result['unit']==0 and lint<=1086)
          Path('artifacts/candidate/reportcards-engineering.json').write_text(json.dumps(result,indent=2)); print(json.dumps(result,indent=2)); assert result['pass'],result
          PY

      - name: Start Report Cards SPA
        shell: bash
        run: |
          set -euo pipefail
          cat > spa_server.py <<'PY'
          import http.server,os,socketserver
          ROOT=os.path.abspath('targets/reportcards/dist/dev-id')
          class H(http.server.SimpleHTTPRequestHandler):
              def translate_path(self,path):
                  original=super().translate_path(path); return os.path.join(ROOT,os.path.relpath(original,os.getcwd()))
              def do_GET(self):
                  clean=self.path.split('?',1)[0].split('#',1)[0]
                  if clean!='/' and not os.path.exists(os.path.join(ROOT,clean.lstrip('/'))): self.path='/index.html'
                  return super().do_GET()
              def end_headers(self): self.send_header('Cache-Control','no-store'); super().end_headers()
          os.chdir(ROOT); socketserver.TCPServer(('127.0.0.1',4200),H).serve_forever()
          PY
          nohup python3 spa_server.py > artifacts/logs/spa.log 2>&1 &
          for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:4200/ >/dev/null; then exit 0; fi; sleep 1; done
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.1'

      - name: Run final desktop, mobile, recovery, media and runtime gates
        working-directory: runner
        shell: bash
        env:
          REPORTCARDS_URL: http://127.0.0.1:4200
          SITI_SERVER_URL: http://127.0.0.1:8001
          SITI_OBJECT_STORAGE_ORIGIN: http://127.0.0.1:9000
          SITI_VALIDATION_OUT: ${{ github.workspace }}/artifacts/gate-b
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
          node audit.mjs | tee ../artifacts/logs/browser-gates.log

      - name: Assemble final machine-readable verdict
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          final={
            'server_no_regression':json.loads(Path('artifacts/candidate/server-no-regression.json').read_text()),
            'reportcards_engineering':json.loads(Path('artifacts/candidate/reportcards-engineering.json').read_text()),
            'gate_a':json.loads(Path('artifacts/gate-a/gate-a-result.json').read_text()),
            's3_contract':json.loads(Path('artifacts/s3-contract/s3-content-type-contract.json').read_text()),
            'gate_b':json.loads(Path('artifacts/gate-b/reportcards-fix-e2e-summary.json').read_text()),
          }
          final['pass']=(final['server_no_regression']['pass'] and final['reportcards_engineering']['pass'] and final['s3_contract']['pass'] and all(final['gate_b']['assertions'].values()))
          Path('artifacts/FINAL-COMPLETION-SUMMARY.json').write_text(json.dumps(final,indent=2)); print(json.dumps(final,indent=2)); assert final['pass'],final
          PY

      - name: Capture evidence
        if: always()
        shell: bash
        run: |
          set +e
          docker logs siti-minio > artifacts/logs/minio.log 2>&1
          find artifacts -type f -printf '%P\t%s bytes\n' | sort > artifacts/ARTIFACT-INDEX.txt
          find artifacts -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS.txt
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siti-oss-final-candidate-only
          path: artifacts
          retention-days: 30
          if-no-files-found: error
