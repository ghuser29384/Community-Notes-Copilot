name: Siti OSS live map deep interaction audit

on:
  pull_request:
    paths:
      - '.github/workflows/siti-oss-live-map-interactions.yml'
      - 'qa/siti-oss-audit/live_map_interaction_audit.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interactions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.1'
      - name: Install Playwright
        shell: bash
        run: |
          mkdir -p runner artifacts
          cp qa/siti-oss-audit/live_map_interaction_audit.mjs runner/audit.mjs
          cd runner
          npm init -y >/dev/null
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Run read-only interaction audit
        working-directory: runner
        env:
          AUDIT_OUTPUT: ${{ github.workspace }}/artifacts
        run: node audit.mjs
      - name: Create evidence index
        if: always()
        shell: bash
        run: |
          find artifacts -type f -printf '%P\t%s bytes\n' | sort > artifacts/ARTIFACT-INDEX.txt
          find artifacts -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siti-oss-live-map-interactions
          path: artifacts
          retention-days: 14
          if-no-files-found: error
