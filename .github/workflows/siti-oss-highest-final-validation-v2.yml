name: Siti OSS highest-level final validation v2

on:
  pull_request:
    paths:
      - '.github/workflows/siti-oss-highest-final-validation-v2.yml'
      - 'qa/siti-oss-highest/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    services:
      postgres:
        image: postgis/postgis:13-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Materialize immutable reviewed helpers
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 3899fa0720639af6eacbf1ffe10d940ceebad366
          mkdir -p qa/siti-oss-final runner artifacts/{logs,baseline,candidate,diffs,gate-a,gate-b,s3-contract}
          for file in \
            apply_candidate_fixes.py \
            apply_gate_fixes_v2.py \
            apply_gate_fixes_v3.py \
            audit_compatibility.sql \
            patch_gate_b_harness_v2.py \
            reportcards_fix_e2e.mjs; do
            git show 3899fa0720639af6eacbf1ffe10d940ceebad366:qa/siti-oss-final/$file \
              > qa/siti-oss-final/$file
          done

      - name: Clone exact public sources
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/petabencana/sitioss-schema.git targets/schema
          git -C targets/schema checkout 091229bff2a299c31b814979008ebc6df7b428e8
          git clone https://github.com/petabencana/-Depricated-sitioss-server.git targets/server
          git -C targets/server checkout 933f345801340027181be21d24671146e3785701
          git clone https://github.com/petabencana/sitioss-reportcards-ng.git targets/reportcards
          git -C targets/reportcards checkout eaec8b1a2bfe15745077c0e8ad5ff69fbdccc552
          for repo in schema server reportcards; do
            git -C "targets/$repo" show -s --format='%H%x09%cI%x09%s' > "artifacts/${repo}-commit.tsv"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '14.21.3'

      - name: Install Report Cards and establish reproducible baseline
        working-directory: targets/reportcards
        shell: bash
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund > ../../artifacts/logs/reportcards-npm-install.log 2>&1
          npm install --save-dev --save-exact @types/jasmine@2.8.16 --no-audit --no-fund \
            > ../../artifacts/logs/reportcards-pin-jasmine-types.log 2>&1
          set +e
          npm run lint > ../../artifacts/baseline/reportcards-lint.log 2>&1
          echo $? > ../../artifacts/baseline/reportcards-lint.exit
          timeout 15m npm test -- --watch=false --browsers=ChromeHeadless \
            > ../../artifacts/baseline/reportcards-unit.log 2>&1
          echo $? > ../../artifacts/baseline/reportcards-unit.exit
          exit 0

      - uses: actions/setup-node@v4
        with:
          node-version: '10.24.1'

      - name: Build isolated baseline and candidate databases
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PG_DEFAULT_DB: postgres
          COUNTRY: id
          DATA: 'true'
          FUNCTIONS: 'true'
          SCHEMA: 'true'
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y postgresql-client
          cd targets/schema
          npm install --no-audit --no-fund > ../../artifacts/logs/schema-npm-install.log 2>&1
          PGDATABASE=cognicity_server_baseline ./build/run.sh \
            > ../../artifacts/logs/schema-build-baseline.log 2>&1
          PGDATABASE=cognicity_highest_final ./build/run.sh \
            > ../../artifacts/logs/schema-build-candidate.log 2>&1
          cd ../..
          for database in cognicity_server_baseline cognicity_highest_final; do
            psql -h 127.0.0.1 -U postgres -d "$database" \
              -v ON_ERROR_STOP=1 -f qa/siti-oss-final/audit_compatibility.sql \
              > "artifacts/logs/compatibility-${database}.log" 2>&1
          done
          cd targets/server
          NODE_ENV=development npm install --production=false --no-audit --no-fund \
            > ../../artifacts/logs/server-npm-install.log 2>&1

      - name: Capture unmodified legacy server lint and full-suite baseline
        working-directory: targets/server
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: cognicity_server_baseline
          PGSSL: 'false'
          PGTIMEOUT: '30000'
          PORT: '8011'
          LOG_CONSOLE: 'false'
          LOG_DIR: /tmp
          LOG_LEVEL: error
          CORS: 'true'
          SECURE_AUTH0: 'false'
          AUTH0_SECRET: local-validation-secret
          AUTH0_CLIENT_ID: local-validation-client
          NOTIFY_ENDPOINT: http://127.0.0.1:8999/notify/
          NOTIFY_API_KEY: local-validation
          AWS_REGION: us-east-1
          AWS_S3_ACCESS_KEY_ID: local-validation
          AWS_S3_SECRET_ACCESS_KEY: local-validation
          AWS_SIGNATURE_VERSION: v4
        run: |
          set +e
          npm run lint > ../../artifacts/baseline/server-lint.log 2>&1
          echo $? > ../../artifacts/baseline/server-lint.exit
          timeout 15m npm run mocha > ../../artifacts/baseline/server-test.log 2>&1
          echo $? > ../../artifacts/baseline/server-test.exit
          exit 0

      - name: Apply candidate and completion fixes
        shell: bash
        run: |
          set -euo pipefail
          SITI_LEGACY_AUDIT_SCRIPTS="$PWD/qa/siti-oss-final" \
          SITI_SERVER_SOURCE="$PWD/targets/server" \
          SITI_REPORTCARDS_SOURCE="$PWD/targets/reportcards" \
            python qa/siti-oss-highest/apply_completion_fixes.py \
            > artifacts/logs/apply-completion-fixes.log
          cp qa/siti-oss-final/reportcards_fix_e2e.mjs runner/audit.mjs
          SITI_BROWSER_HARNESS="$PWD/runner/audit.mjs" \
            python qa/siti-oss-final/patch_gate_b_harness_v2.py \
            > artifacts/logs/patch-gate-b-harness-v2.log
          SITI_BROWSER_HARNESS="$PWD/runner/audit.mjs" \
            python qa/siti-oss-highest/patch_final_browser_harness.py \
            > artifacts/logs/patch-final-browser-harness.log
          git -C targets/server diff --check
          git -C targets/reportcards -c core.whitespace=cr-at-eol diff --check
          git -C targets/server diff --binary > artifacts/diffs/server-product-candidate.patch
          git -C targets/reportcards diff --binary > artifacts/diffs/reportcards-product-candidate.patch

      - name: Adapt deprecated server test fixtures to its validated contract
        shell: bash
        run: |
          set -euo pipefail
          SITI_SERVER_SOURCE="$PWD/targets/server" \
            python qa/siti-oss-highest/patch_server_test_contract.py \
            > artifacts/logs/patch-server-test-contract.log

      - name: Run candidate server build, lint and full suite with real exits
        working-directory: targets/server
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: cognicity_highest_final
          PGSSL: 'false'
          PGTIMEOUT: '30000'
          PORT: '8012'
          LOG_CONSOLE: 'false'
          LOG_DIR: /tmp
          LOG_LEVEL: error
          CORS: 'true'
          SECURE_AUTH0: 'false'
          AUTH0_SECRET: local-validation-secret
          AUTH0_CLIENT_ID: local-validation-client
          NOTIFY_ENDPOINT: http://127.0.0.1:8999/notify/
          NOTIFY_API_KEY: local-validation
          AWS_REGION: us-east-1
          AWS_S3_ACCESS_KEY_ID: minioadmin
          AWS_S3_SECRET_ACCESS_KEY: minioadmin123
          AWS_SIGNATURE_VERSION: v4
        run: |
          set +e
          npm run build > ../../artifacts/candidate/server-build.log 2>&1
          echo $? > ../../artifacts/candidate/server-build.exit
          npm run lint > ../../artifacts/candidate/server-lint.log 2>&1
          echo $? > ../../artifacts/candidate/server-lint.exit
          timeout 15m npm run mocha > ../../artifacts/candidate/server-test.log 2>&1
          echo $? > ../../artifacts/candidate/server-test.exit
          exit 0

      - name: Compare legacy full-suite and lint baselines
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          def lint_server(path):
              text=Path(path).read_text(errors='replace')
              match=re.findall(r'✖\s+(\d+)\s+problems',text)
              return int(match[-1]) if match else 0
          def lint_cards(path):
              return sum(1 for line in Path(path).read_text(errors='replace').splitlines() if line.startswith('ERROR:'))
          def mocha(path):
              text=Path(path).read_text(errors='replace')
              passing=re.findall(r'\b(\d+) passing\b',text)
              failing=re.findall(r'\b(\d+) failing\b',text)
              return {'passing':int(passing[-1]) if passing else 0,'failing':int(failing[-1]) if failing else 0}
          result={
            'server_lint':{
              'baseline':lint_server('artifacts/baseline/server-lint.log'),
              'candidate':lint_server('artifacts/candidate/server-lint.log'),
            },
            'reportcards_lint':{
              'baseline':lint_cards('artifacts/baseline/reportcards-lint.log'),
              'candidate':None,
            },
            'server_full_suite':{
              'baseline':mocha('artifacts/baseline/server-test.log'),
              'candidate':mocha('artifacts/candidate/server-test.log'),
            },
          }
          result['server_lint']['delta']=result['server_lint']['candidate']-result['server_lint']['baseline']
          result['server_lint']['no_regression']=result['server_lint']['delta'] <= 0
          suite=result['server_full_suite']
          suite['no_regression']=(suite['candidate']['failing'] <= suite['baseline']['failing'] and suite['candidate']['passing'] >= suite['baseline']['passing'])
          Path('artifacts/candidate/pre-reportcards-regression.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          assert result['server_lint']['no_regression'], result
          assert suite['no_regression'], result
          PY

      - name: Restore validation-only test fixture edits
        shell: bash
        run: |
          set -euo pipefail
          git -C targets/server checkout -- src/test/testCards.js
          git -C targets/server diff --check

      - name: Start MinIO and create isolated upload bucket
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name siti-minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin123 \
            -e MINIO_API_CORS_ALLOW_ORIGIN=http://127.0.0.1:4200 \
            minio/minio:latest server /data --console-address ':9001'
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null
          node <<'NODE'
          const AWS = require('./targets/server/node_modules/aws-sdk');
          const s3 = new AWS.S3({
            accessKeyId: 'minioadmin', secretAccessKey: 'minioadmin123',
            signatureVersion: 'v4', region: 'us-east-1',
            endpoint: 'http://127.0.0.1:9000', s3ForcePathStyle: true,
          });
          s3.createBucket({ Bucket: 'petabencana-image-uploads' }).promise()
            .catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Start patched backend against PostGIS and MinIO
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: cognicity_highest_final
          PGSSL: 'false'
          PGTIMEOUT: '30000'
          PORT: '8001'
          LOG_CONSOLE: 'true'
          LOG_DIR: /tmp
          LOG_LEVEL: error
          CORS: 'true'
          SECURE_AUTH0: 'true'
          AUTH0_SECRET: local-validation-secret
          AUTH0_CLIENT_ID: local-validation-client
          NOTIFY_ENDPOINT: http://127.0.0.1:8999/notify/
          NOTIFY_API_KEY: local-validation
          AWS_REGION: us-east-1
          AWS_S3_ACCESS_KEY_ID: minioadmin
          AWS_S3_SECRET_ACCESS_KEY: minioadmin123
          AWS_SIGNATURE_VERSION: v4
          AWS_S3_ENDPOINT: http://127.0.0.1:9000
          AWS_S3_FORCE_PATH_STYLE: 'true'
          IMAGES_BUCKET: petabencana-image-uploads
          IMAGES_HOST: images.petabencana.invalid
          IMAGE_MIME_TYPES: image/png,image/jpeg
        run: |
          set -euo pipefail
          test "$(cat artifacts/candidate/server-build.exit)" = '0'
          cat > notify_stub.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  length=int(self.headers.get('content-length','0'))
                  if length: self.rfile.read(length)
                  self.send_response(200); self.end_headers(); self.wfile.write(b'{"ok":true}')
              def log_message(self, fmt, *args): pass
          HTTPServer(('127.0.0.1',8999),Handler).serve_forever()
          PY
          nohup python3 notify_stub.py > artifacts/logs/notify-stub.log 2>&1 &
          NODE_ENV=production nohup node targets/server/dist > artifacts/logs/server.log 2>&1 &
          echo $! > artifacts/logs/server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8001/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/logs/server.log
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce final 50-way duplicate contract
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests psycopg2-binary
          python - <<'PY' | tee artifacts/gate-a/gate-a-result.json
          import concurrent.futures, json, requests, psycopg2
          from collections import Counter
          base='http://127.0.0.1:8001'
          card=requests.post(base+'/cards',json={'username':'highest-final-duplicate','network':'twitter','language':'en','network_data':{}},timeout=20)
          card.raise_for_status(); card_id=card.json()['cardId']
          payload={'disaster_type':'flood','partnerCode':'','tweetID':'','is_training':True,'sub_submission':False,'card_data':{'report_type':'flood','flood_depth':44},'text':'highest final duplicate gate','image_url':'','created_at':'2026-08-04T04:00:00.000Z','location':{'lat':-6.1754,'lng':106.8272}}
          def submit(_):
              r=requests.put(base+'/cards/'+card_id,json=payload,timeout=30)
              try: body=r.json()
              except Exception: body=r.text
              return {'status':r.status_code,'body':body}
          with concurrent.futures.ThreadPoolExecutor(max_workers=50) as pool: results=list(pool.map(submit,range(50)))
          counts=Counter(r['status'] for r in results)
          with psycopg2.connect(host='127.0.0.1',port=5432,user='postgres',password='postgres',dbname='cognicity_highest_final') as conn:
              with conn.cursor() as cur:
                  cur.execute('SELECT count(*) FROM grasp.reports WHERE card_id=%s',(card_id,)); reports=cur.fetchone()[0]
                  cur.execute("SELECT count(*) FROM cognicity.all_reports WHERE source='grasp' AND url=%s",(card_id,)); all_reports=cur.fetchone()[0]
                  cur.execute("SELECT count(*) FROM grasp.log WHERE card_id=%s AND event_type='REPORT SUBMITTED'",(card_id,)); logs=cur.fetchone()[0]
          output={'card_id':card_id,'attempts':50,'status_counts':dict(counts),'report_rows':reports,'all_report_rows':all_reports,'submitted_log_rows':logs,'sample_results':results[:15]}
          print(json.dumps(output,indent=2))
          assert counts[200] == 1 and counts[409] == 49, output
          assert sum(v for k,v in counts.items() if k not in (200,409)) == 0, output
          assert reports == 1 and all_reports == 1 and logs == 1, output
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.1'

      - name: Verify real S3-compatible Content-Type enforcement
        shell: bash
        env:
          SITI_SERVER_URL: http://127.0.0.1:8001
          SITI_S3_CONTRACT_OUT: ${{ github.workspace }}/artifacts/s3-contract
        run: |
          set -euo pipefail
          node qa/siti-oss-highest/s3_signature_contract.mjs | tee artifacts/logs/s3-signature-contract.log

      - uses: actions/setup-node@v4
        with:
          node-version: '14.21.3'

      - name: Configure and run candidate Report Cards engineering checks
        working-directory: targets/reportcards
        shell: bash
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ['environment.json','environment.prod.json']:
              path=Path('src/environments/id')/name
              data=json.loads(path.read_text())
              data['data_server']='http://127.0.0.1:8001/'
              data['app']='http://127.0.0.1:4200/'
              path.write_text(json.dumps(data,indent=2))
          PY
          set +e
          npm run build-dev-id > ../../artifacts/candidate/reportcards-build-dev.log 2>&1
          echo $? > ../../artifacts/candidate/reportcards-build-dev.exit
          npm run build-prod-id > ../../artifacts/candidate/reportcards-build-prod.log 2>&1
          echo $? > ../../artifacts/candidate/reportcards-build-prod.exit
          npm run lint > ../../artifacts/candidate/reportcards-lint.log 2>&1
          echo $? > ../../artifacts/candidate/reportcards-lint.exit
          timeout 15m npm test -- --watch=false --browsers=ChromeHeadless \
            > ../../artifacts/candidate/reportcards-unit.log 2>&1
          echo $? > ../../artifacts/candidate/reportcards-unit.exit
          exit 0

      - name: Complete lint regression comparison
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('artifacts/candidate/pre-reportcards-regression.json').read_text())
          count=lambda p:sum(1 for line in Path(p).read_text(errors='replace').splitlines() if line.startswith('ERROR:'))
          data['reportcards_lint']['candidate']=count('artifacts/candidate/reportcards-lint.log')
          data['reportcards_lint']['delta']=data['reportcards_lint']['candidate']-data['reportcards_lint']['baseline']
          data['reportcards_lint']['no_regression']=data['reportcards_lint']['delta'] <= 0
          Path('artifacts/candidate/regression-summary.json').write_text(json.dumps(data,indent=2))
          print(json.dumps(data,indent=2))
          assert data['reportcards_lint']['no_regression'], data
          PY

      - name: Start Report Cards SPA with history fallback
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat artifacts/candidate/reportcards-build-dev.exit)" = '0'
          cat > spa_server.py <<'PY'
          import http.server, os, socketserver
          ROOT=os.path.abspath('targets/reportcards/dist/dev-id')
          class Handler(http.server.SimpleHTTPRequestHandler):
              def translate_path(self,path):
                  original=super().translate_path(path); rel=os.path.relpath(original,os.getcwd()); return os.path.join(ROOT,rel)
              def do_GET(self):
                  clean=self.path.split('?',1)[0].split('#',1)[0]; candidate=os.path.join(ROOT,clean.lstrip('/'))
                  if clean!='/' and not os.path.exists(candidate): self.path='/index.html'
                  return super().do_GET()
              def end_headers(self): self.send_header('Cache-Control','no-store'); super().end_headers()
          os.chdir(ROOT)
          with socketserver.TCPServer(('127.0.0.1',4200),Handler) as httpd: httpd.serve_forever()
          PY
          nohup python3 spa_server.py > artifacts/logs/reportcards-static-server.log 2>&1 &
          echo $! > artifacts/logs/reportcards-static-server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4200/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.1'

      - name: Run final desktop, mobile, recovery, media and runtime gates
        working-directory: runner
        shell: bash
        env:
          REPORTCARDS_URL: http://127.0.0.1:4200
          SITI_SERVER_URL: http://127.0.0.1:8001
          SITI_OBJECT_STORAGE_ORIGIN: http://127.0.0.1:9000
          SITI_VALIDATION_OUT: ${{ github.workspace }}/artifacts/gate-b
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
          node audit.mjs | tee ../artifacts/logs/final-browser-gates.log

      - name: Enforce final completion criteria
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def code(name): return int(Path('artifacts/candidate',name).read_text().strip())
          required={
            'server_build':code('server-build.exit'),
            'reportcards_build_dev':code('reportcards-build-dev.exit'),
            'reportcards_build_prod':code('reportcards-build-prod.exit'),
            'reportcards_unit':code('reportcards-unit.exit'),
          }
          regression=json.loads(Path('artifacts/candidate/regression-summary.json').read_text())
          browser=json.loads(Path('artifacts/gate-b/reportcards-fix-e2e-summary.json').read_text())
          s3=json.loads(Path('artifacts/s3-contract/s3-content-type-contract.json').read_text())
          gate_a=json.loads(Path('artifacts/gate-a/gate-a-result.json').read_text())
          final={'required_exit_codes':required,'regression':regression,'browser_assertions':browser['assertions'],'browser_scenario_count':browser['scenarioCount'],'s3_contract':s3,'gate_a':gate_a}
          final['pass']=(all(v == 0 for v in required.values()) and regression['server_lint']['no_regression'] and regression['reportcards_lint']['no_regression'] and regression['server_full_suite']['no_regression'] and all(browser['assertions'].values()) and s3['pass'])
          Path('artifacts/FINAL-COMPLETION-SUMMARY.json').write_text(json.dumps(final,indent=2))
          print(json.dumps(final,indent=2))
          assert final['pass'], final
          PY

      - name: Capture complete evidence and checksums
        if: always()
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set +e
          psql -h 127.0.0.1 -U postgres -d cognicity_highest_final \
            -c 'SELECT count(*) AS cards FROM grasp.cards; SELECT count(*) AS reports FROM grasp.reports; SELECT count(*) AS all_reports FROM cognicity.all_reports;' \
            > artifacts/database-end-state.txt 2>&1
          docker logs siti-minio > artifacts/logs/minio.log 2>&1
          find artifacts -type f -printf '%P\t%s bytes\n' | sort > artifacts/ARTIFACT-INDEX.txt
          find artifacts -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS.txt
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siti-oss-highest-final-validation-v2-20260804
          path: artifacts
          retention-days: 30
          if-no-files-found: error
