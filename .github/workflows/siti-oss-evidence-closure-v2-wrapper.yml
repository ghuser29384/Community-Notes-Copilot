name: Siti OSS evidence closure v2 wrapper

on:
  pull_request:
    paths:
      - '.github/workflows/siti-oss-evidence-closure-v2-wrapper.yml'
      - 'qa/siti-oss-evidence-closure-v2/patch_audit_v3.py'
      - 'qa/siti-oss-evidence-closure-v2/write_focused_specs.py'
      - 'qa/siti-oss-evidence-closure-v2/patch_focused_specs_v2.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: siti-oss-evidence-closure-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence-closure-wrapper:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgis/postgis:13-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Execute the evidence-closure script with strict closure patches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          BOOT="$GITHUB_WORKSPACE/bootstrap"
          git clone --single-branch --branch "$HEAD_BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$BOOT"
          export BOOT
          python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import textwrap

          source_commit = 'a3ddd632b5985adf1a7abefa9ba32b376e69c10e'
          source_path = '.github/workflows/siti-oss-evidence-closure-v2-pure.yml'
          source_text = subprocess.check_output(
              ['git', '-C', os.environ['BOOT'], 'show', f'{source_commit}:{source_path}'],
              text=True,
          )
          lines = source_text.splitlines()
          marker = next(i for i, line in enumerate(lines) if line.strip() == 'run: |')
          script = textwrap.dedent('\n'.join(lines[marker + 1:])) + '\n'

          cors_block = """s3.put_bucket_cors(
              Bucket=bucket,
              CORSConfiguration={
                  'CORSRules': [{
                      'AllowedHeaders': ['*'],
                      'AllowedMethods': ['GET', 'HEAD', 'PUT'],
                      'AllowedOrigins': ['http://127.0.0.1:4200'],
                      'ExposeHeaders': ['ETag'],
                      'MaxAgeSeconds': 3600,
                  }]
              },
          )
          """
          if script.count(cors_block) != 1:
              raise RuntimeError(f'expected one MinIO-incompatible PutBucketCors block, found {script.count(cors_block)}')
          script = script.replace(
              cors_block,
              "# MinIO API CORS is configured by MINIO_API_CORS_ALLOW_ORIGIN;\n# this image does not implement the S3 PutBucketCors API.\n",
              1,
          )

          old_invocation = 'python qa/siti-oss-evidence-closure-v2/patch_audit_v2.py'
          new_invocation = 'python qa/siti-oss-evidence-closure-v2/patch_audit_v3.py'
          if script.count(old_invocation) != 1:
              raise RuntimeError(f'expected one v2 helper invocation, found {script.count(old_invocation)}')
          script = script.replace(old_invocation, new_invocation, 1)

          focused_anchor = (
              'cd targets/reportcards\n'
              'cp src/test.ts ../../artifacts/engineering-v2/test.ts.original\n'
          )
          focused_replacement = (
              'cd targets/reportcards\n'
              'python "$REPO/qa/siti-oss-evidence-closure-v2/write_focused_specs.py" "$REPO/targets/reportcards" '
              '> ../../artifacts/logs/write-focused-specs.log\n'
              'python "$REPO/qa/siti-oss-evidence-closure-v2/patch_focused_specs_v2.py" "$REPO/targets/reportcards" '
              '> ../../artifacts/logs/patch-focused-specs-v2.log\n'
              'cp src/test.ts ../../artifacts/engineering-v2/test.ts.original\n'
          )
          if script.count(focused_anchor) != 1:
              raise RuntimeError(f'expected one focused-test anchor, found {script.count(focused_anchor)}')
          script = script.replace(focused_anchor, focused_replacement, 1)

          old_regex = r'''new = r"/(image-uploader\.component\.spec|location-picker\.component\.spec)\.ts$/"'''
          new_regex = r'''new = r"/(image-uploader\.component\.spec|location-picker\.component\.spec|submit-button\.component\.focused\.spec|deck\.service\.focused\.spec)\.ts$/"'''
          if script.count(old_regex) != 1:
              raise RuntimeError(f'expected one focused-test regex, found {script.count(old_regex)}')
          script = script.replace(old_regex, new_regex, 1)

          core_tail = """    storage['object_count'] >= 2 and
              result['fresh_patch_application_and_builds']
          )
          """
          strict_tail = """    storage['object_count'] >= 2 and
              result['fresh_patch_application_and_builds'] and
              focused_unit_exit == 0
          )
          """
          if script.count(core_tail) != 1:
              raise RuntimeError(f'expected one core-pass tail, found {script.count(core_tail)}')
          script = script.replace(core_tail, strict_tail, 1)

          output = Path('/tmp/siti-oss-evidence-closure-v2.sh')
          output.write_text(script, encoding='utf-8')
          print({
              'source_commit': source_commit,
              'source_path': source_path,
              'output': str(output),
              'bytes': output.stat().st_size,
              'focused_unit_required': True,
              'helper': new_invocation,
              'focused_specs_written': True,
              'focused_specs_patched': True,
          })
          PY
          bash /tmp/siti-oss-evidence-closure-v2.sh