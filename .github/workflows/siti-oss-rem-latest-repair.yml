name: Siti OSS REM latest repair verification

on:
  pull_request:
    paths:
      - '.github/workflows/siti-oss-rem-latest-repair.yml'
      - 'qa/siti-oss-highest-level/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-rem-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Clone exact source and apply proposed repair
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git clone https://github.com/petabencana/sitioss-rem-latest.git target
          git -C target checkout 0fbd435aa1e05dba53232084738274fba92ccf50
          python qa/siti-oss-highest-level/apply-rem-latest-fixes.py
          git -C target diff --check
          git -C target diff --binary > artifacts/applied.patch
          git -C target status --short > artifacts/status.txt
      - name: Install, lint, typecheck, and build repaired source
        id: checks
        continue-on-error: true
        working-directory: target
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        shell: bash
        run: |
          set +e
          npm install > ../artifacts/npm-install.txt 2>&1
          install_ec=$?; echo "$install_ec" > ../artifacts/npm-install-exit-code.txt
          npm run lint > ../artifacts/lint.txt 2>&1
          lint_ec=$?; echo "$lint_ec" > ../artifacts/lint-exit-code.txt
          npx tsc --noEmit > ../artifacts/typecheck.txt 2>&1
          type_ec=$?; echo "$type_ec" > ../artifacts/typecheck-exit-code.txt
          npm run build > ../artifacts/build.txt 2>&1
          build_ec=$?; echo "$build_ec" > ../artifacts/build-exit-code.txt
          find .next -type f -printf '%p\t%s bytes\n' 2>/dev/null | sort > ../artifacts/next-files.txt
          exit 0
      - name: Browser smoke the no-secrets configuration state
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cd target
          nohup npm start > ../artifacts/server.txt 2>&1 &
          server_pid=$!
          echo "$server_pid" > ../artifacts/server.pid
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/ > ../artifacts/home.html && break
            sleep 1
          done
          grep -q 'Authentication configuration required' ../artifacts/home.html
          echo $? > ../artifacts/smoke-exit-code.txt
          exit 0
      - name: Package evidence before gates
        if: always()
        run: |
          find artifacts -type f -printf '%P\t%s bytes\n' | sort > artifacts/ARTIFACT-INDEX.txt
          find artifacts -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siti-oss-rem-latest-repaired
          path: artifacts
          retention-days: 14
          if-no-files-found: error
      - name: Repaired engineering and smoke gate
        if: always()
        run: |
          test "$(cat artifacts/npm-install-exit-code.txt)" -eq 0
          test "$(cat artifacts/lint-exit-code.txt)" -eq 0
          test "$(cat artifacts/typecheck-exit-code.txt)" -eq 0
          test "$(cat artifacts/build-exit-code.txt)" -eq 0
          test "$(cat artifacts/smoke-exit-code.txt)" -eq 0
