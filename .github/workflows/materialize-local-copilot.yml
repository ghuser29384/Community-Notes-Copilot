name: Inspect incomplete local copilot bundle

on:
  push:
    branches:
      - agent/local-ephemeral-community-notes-copilot-ready
    paths:
      - .github/workflows/materialize-local-copilot.yml
  pull_request:
    paths:
      - .github/workflows/materialize-local-copilot.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-ephemeral-community-notes-copilot-ready
      - name: Stream-validate complete archive members without materializing the branch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap/local-copilot.part00 > /tmp/local-copilot.tar.gz
          echo "decoded_bundle_sha256=$(sha256sum /tmp/local-copilot.tar.gz | awk '{print $1}')"
          rm -rf /tmp/salvage && mkdir -p /tmp/salvage
          python3 - <<'PY'
          import pathlib
          import tarfile

          archive = pathlib.Path('/tmp/local-copilot.tar.gz')
          out = pathlib.Path('/tmp/salvage')
          allowed_roots = {
              'local_copilot', 'apps', 'tests', 'scripts', 'docs',
              'requirements-dev.txt', '.github'
          }
          recovered = []
          failure = None
          try:
              with tarfile.open(archive, mode='r|gz') as tf:
                  while True:
                      try:
                          member = tf.next()
                      except (EOFError, tarfile.ReadError) as exc:
                          failure = f'{type(exc).__name__}: {exc}'
                          break
                      if member is None:
                          break
                      p = pathlib.PurePosixPath(member.name)
                      if p.is_absolute() or '..' in p.parts:
                          raise SystemExit(f'unsafe archive path: {member.name}')
                      if not p.parts or p.parts[0] not in allowed_roots:
                          raise SystemExit(f'unexpected archive root: {member.name}')
                      if member.issym() or member.islnk() or member.isdev():
                          raise SystemExit(f'unsupported archive member: {member.name}')
                      tf.extract(member, path=out, filter='data')
                      recovered.append(member.name)
          finally:
              print(f'RECOVERED_COUNT={len(recovered)}')
              print(f'STREAM_FAILURE={failure or "none"}')
              print('RECOVERED_MEMBERS_BEGIN')
              print('\n'.join(recovered))
              print('RECOVERED_MEMBERS_END')
          PY
          echo 'KEY_SOURCE_DUMP_BEGIN'
          for f in \
            /tmp/salvage/apps/extension/manifest.json \
            /tmp/salvage/apps/extension/background.js \
            /tmp/salvage/apps/extension/content.js \
            /tmp/salvage/apps/extension/sidepanel.js \
            /tmp/salvage/local_copilot/*.py \
            /tmp/salvage/tests/test_*.py; do
            if [ -f "$f" ]; then
              echo "===== ${f#/tmp/salvage/} ====="
              sed -n '1,240p' "$f"
            fi
          done
          echo 'KEY_SOURCE_DUMP_END'
      - name: Upload recovered complete members for bounded inspection
        uses: actions/upload-artifact@v4
        with:
          name: incomplete-bundle-recovered-members
          path: /tmp/salvage
          if-no-files-found: error
          retention-days: 7
