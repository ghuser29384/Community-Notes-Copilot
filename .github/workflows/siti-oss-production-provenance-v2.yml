name: Siti OSS production source attribution v2

on:
  pull_request:
    paths:
      - '.github/workflows/siti-oss-production-provenance-v2.yml'
      - 'qa/siti-oss-provenance/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Capture production assets and compare public repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITI_PROD_ORIGIN: https://petabencana.id
          SITI_PROVENANCE_OUT: ${{ github.workspace }}/artifacts/production-provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/production-provenance
          python qa/siti-oss-provenance/production_source_attribution.py \
            | tee artifacts/production-provenance-console.log
          python qa/siti-oss-provenance/correct_attribution.py \
            | tee artifacts/production-provenance-corrected-console.log
      - name: Index and checksum evidence
        if: always()
        shell: bash
        run: |
          set +e
          find artifacts -type f -printf '%P\t%s bytes\n' | sort > artifacts/ARTIFACT-INDEX.txt
          find artifacts -type f ! -name SHA256SUMS.txt -print0 | sort -z \
            | xargs -0 sha256sum > artifacts/SHA256SUMS.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siti-oss-production-source-attribution-v2
          path: artifacts
          retention-days: 14
          if-no-files-found: error
